<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Construction et déploiement des conteneurs</title>
<desc id="d">Deux images sont construites : l'application, en deux étapes, et l'agent, avec les outils du projet. PostgreSQL est une image officielle. Deux variantes de déploiement : tout dans Docker Compose pour une personne de confiance, ou l'outil sur la machine avec Docker sans root pour une équipe.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
</defs>
<rect x="0.75" y="0.75" width="1198.5" height="848.5" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="50" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">Construction et déploiement des conteneurs</text>
<text x="40" y="74" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Deux images construites ici, une image de base de données prête à l'emploi, deux façons de les faire tourner</text>
<rect x="40" y="100" width="560" height="250" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="128" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">IMAGE « APPLICATION »</text>
<text x="60" y="147" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Dockerfile, construction en 2 étapes</text>
<rect x="60" y="160" width="200" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75" stroke-dasharray="6 5"/>
<text x="160" y="187" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">1. Compilation</text>
<text x="160" y="210" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">Node 24 + TypeScript</text>
<text x="160" y="229" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">npm ci, puis tsc</text>
<text x="160" y="248" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">produit le code compilé</text>
<path d="M260 225 L330 225" fill="none" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="295" y="205" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">code</text>
<text x="295" y="219" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">compilé</text>
<rect x="330" y="160" width="250" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75"/>
<text x="455" y="187" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">2. Exécution (image finale)</text>
<text x="455" y="210" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">Node 24 allégé + git</text>
<text x="455" y="229" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CLI Claude Code installée</text>
<text x="455" y="248" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">dépendances de production seules</text>
<text x="455" y="267" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">code compilé, prompts, interface</text>
<text x="455" y="286" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">utilisateur sans droits</text>
<text x="160" y="316" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">outils de build : absents</text>
<text x="160" y="332" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">de l'image finale</text>
<rect x="620" y="100" width="540" height="250" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="640" y="128" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start">IMAGE « AGENT »</text>
<text x="640" y="147" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Dockerfile.agent, une seule étape</text>
<rect x="640" y="160" width="240" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75"/>
<text x="760" y="187" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Environnement de l'agent</text>
<text x="760" y="210" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">Node 24 allégé + git</text>
<text x="760" y="229" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">CLI Claude Code</text>
<text x="760" y="248" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">+ outils du projet (paquets</text>
<text x="760" y="267" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">au choix : PHP, Python, tests)</text>
<path d="M880 235 L920 235" fill="none" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="920" y="160" width="220" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75"/>
<text x="1030" y="187" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Choix par projet</text>
<text x="1030" y="210" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">image par défaut</text>
<text x="1030" y="229" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">ou image dédiée à une pile</text>
<text x="1030" y="248" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">parmi une liste autorisée</text>
<text x="1030" y="267" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">jamais téléchargée à la volée</text>
<rect x="40" y="385" width="560" height="395" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="413" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">VARIANTE 1 · TOUT DANS DOCKER COMPOSE</text>
<text x="60" y="432" font-size="12" font-weight="400" fill="#475569" text-anchor="start">une personne de confiance, sans comptes</text>
<rect x="60" y="440" width="520" height="320" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="75" y="460" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Machine (serveur)</text>
<rect x="80" y="475" width="240" height="175" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.75"/>
<text x="200" y="502" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Conteneur application</text>
<text x="200" y="525" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">interface, files, pipelines</text>
<text x="200" y="544" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">les agents tournent ICI,</text>
<text x="200" y="563" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">dans ce même conteneur</text>
<text x="200" y="582" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">lecture seule, sans capacité</text>
<text x="200" y="601" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">2,5 Go de mémoire, 2 processeurs</text>
<rect x="380" y="475" width="180" height="175" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75"/>
<text x="470" y="502" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">Conteneur base</text>
<text x="470" y="525" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">PostgreSQL 16</text>
<text x="470" y="544" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">réseau interne,</text>
<text x="470" y="563" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">sans accès à Internet</text>
<text x="470" y="582" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">aucun port publié</text>
<text x="470" y="601" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">volume de données</text>
<path d="M320 560 L380 560" fill="none" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="350" y="545" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">SQL</text>
<rect x="80" y="672" width="480" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="320" y="696" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Accès : 127.0.0.1:4321 seulement, par tunnel SSH</text>
<text x="320" y="716" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">Isolation faible entre agents : personnes de confiance seulement.</text>
<text x="320" y="734" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">Refusé dès qu'une connexion par compte est configurée.</text>
<rect x="620" y="385" width="540" height="395" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="640" y="413" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start">VARIANTE 2 · OUTIL SUR LA MACHINE + DOCKER SANS ROOT</text>
<text x="640" y="432" font-size="12" font-weight="400" fill="#475569" text-anchor="start">équipe avec comptes (obligatoire dès qu'il y a des comptes)</text>
<rect x="640" y="440" width="500" height="320" rx="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="655" y="460" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Machine (serveur)</text>
<rect x="660" y="475" width="200" height="125" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.75"/>
<text x="760" y="502" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Service de l'outil</text>
<text x="760" y="525" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">utilisateur dédié, sans</text>
<text x="760" y="544" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">sudo ni groupe docker</text>
<text x="760" y="563" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">démarré par systemd</text>
<rect x="660" y="630" width="200" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75"/>
<text x="760" y="657" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">PostgreSQL (compose)</text>
<text x="760" y="680" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">seule la base tourne</text>
<text x="760" y="699" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">dans un conteneur</text>
<text x="760" y="718" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">port local seulement</text>
<path d="M760 600 L760 630" fill="none" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect x="940" y="475" width="180" height="265" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.75"/>
<text x="1030" y="502" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Docker sans root</text>
<text x="1030" y="521" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">démon de l'utilisateur dédié</text>
<rect x="955" y="540" width="150" height="58" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.75"/>
<text x="1030" y="567" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">Agent, tâche 1</text>
<rect x="955" y="612" width="150" height="58" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.75"/>
<text x="1030" y="639" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">Agent, tâche 2</text>
<text x="1030" y="700" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">un conteneur jetable</text>
<text x="1030" y="717" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">par tâche, détruit à la fin</text>
<path d="M860 537 L940 537" fill="none" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="900" y="514" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">docker</text>
<text x="900" y="527" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">run</text>
<rect x="40" y="798" width="1120" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="600" y="821" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">Les images se construisent avec « docker build » (ou « docker compose up -d --build »). L'image d'agent est construite à l'avance, jamais téléchargée au lancement d'une tâche.</text>
</svg>
