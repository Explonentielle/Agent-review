<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f7f8fa; --hover: #f0f2f6;
    --text: #151922; --text-2: #4b5363; --muted: #7a8293; --border: #e4e7ec; --border-strong: #d3d8e0;
    --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef0ff; --accent-text: #3730a3;
    --red: #d92d20; --red-soft: #fef1f0; --red-border: #f8c9c4;
    --orange: #dc6803; --orange-soft: #fff5e8; --orange-border: #f9d9b0;
    --yellow: #a37b00; --yellow-soft: #fdf8e3; --yellow-border: #efe0a4;
    --green: #079455; --green-soft: #ecfbf3; --green-border: #b5e8cc;
    --gray-soft: #f1f3f6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a21; --surface-2: #1c2029; --hover: #222733;
      --text: #e8eaf0; --text-2: #b4bac7; --muted: #868d9c; --border: #272c37; --border-strong: #353b48;
      --accent: #7c74ff; --accent-hover: #918aff; --accent-soft: #23233f; --accent-text: #c4c0ff;
      --red: #ff6b5e; --red-soft: #2c1717; --red-border: #5a2a25;
      --orange: #ff9f45; --orange-soft: #2c2014; --orange-border: #5a3d1e;
      --yellow: #e8c547; --yellow-soft: #29250f; --yellow-border: #554a1c;
      --green: #3ccf8e; --green-soft: #12261d; --green-border: #1f4d37;
      --gray-soft: #222733;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; font-size: 12.5px; }
  :not(pre) > code { background: var(--gray-soft); padding: 1px 5px; border-radius: 4px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Terminal Claude ---------- */
  .term-panel { margin-top: 12px; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: #0d1117; }
  .term-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #161b22; color: #c9d1d9; font-size: 12.5px; }
  .term-head .spacer { flex: 1; }
  .term-hint { padding: 8px 12px; background: #161b22; color: #9da7b3; font-size: 12.5px; border-top: 1px solid #222a33; }
  #term-host { padding: 8px; overflow-x: auto; }
  .claude-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
  #claude-block { margin-top: 18px; }

  /* ---------- Structure : sidebar + contenu ---------- */
  body { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100vh; overflow: hidden; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 12px 14px; min-height: 0; overflow-y: auto; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; white-space: nowrap; padding: 0 8px 10px; letter-spacing: -.01em; }
  .brand small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; padding: 16px 10px 6px; }
  .tab { display: flex; align-items: center; gap: 11px; width: 100%; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font-weight: 500; text-align: left; white-space: nowrap; position: relative; }
  .tab svg { width: 18px; height: 18px; flex: none; opacity: .75; }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .tab.active svg { opacity: 1; }
  .tab .badge { margin-left: auto; }
  .badge { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; background: var(--gray-soft); color: var(--text-2); }
  .badge.hot { background: var(--red); color: #fff; }
  .badge.live { background: var(--accent); color: #fff; }
  .collapse-btn { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin: 0 8px 6px; padding: 3px 9px 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 12px; }
  .collapse-btn svg { width: 14px; height: 14px; transition: transform .15s; }
  .collapse-btn:hover { color: var(--text); background: var(--hover); }
  .main { min-width: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .topbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .crumb { font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-right { display: flex; align-items: center; gap: 8px; }
  #mode { cursor: pointer; }
  .userchip { padding: 0 10px 0 3px; }
  .userchip small { color: var(--muted); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; }
  .subnav { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px 19px; padding-left: 10px; border-left: 1px solid var(--border); }
  .subnav button { text-align: left; border: 0; background: none; color: var(--muted); font-size: 13px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subnav button:hover { background: var(--hover); color: var(--text); }
  .subnav button.active { color: var(--accent-text); font-weight: 600; }

  /* Sidebar repliée : icônes seules (choix mémorisé, forcé sur écran moyen) */
  body.collapsed { grid-template-columns: 68px minmax(0, 1fr); }
  body.collapsed .sidebar { padding: 16px 10px; }
  body.collapsed .brand { justify-content: center; padding: 0 0 10px; }
  body.collapsed :is(.brand > div, .nav-label, .lbl, .subnav) { display: none; }
  body.collapsed .collapse-btn { align-self: center; margin: 0 0 6px; padding: 4px 6px; }
  body.collapsed .nav { gap: 4px; }
  body.collapsed .tab { justify-content: center; padding: 0; height: 42px; }
  body.collapsed .tab .badge { position: absolute; top: 3px; right: 4px; margin: 0; min-width: 16px; height: 16px; font-size: 10px; padding: 0 4px; }
  body.collapsed .collapse-btn svg { transform: rotate(180deg); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
  .mode-comment .dot { background: var(--orange); }
  .mode-auto .dot { background: var(--green); }

  /* ---------- Vues ---------- */
  .view { flex: 1; min-height: 0; overflow: hidden; }
  .split { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }
  .pane { overflow-y: auto; }
  .list-pane { border-right: 1px solid var(--border); background: var(--surface); }
  .list-head { padding: 14px 16px 10px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 1; }
  .list-head .row { display: flex; align-items: baseline; justify-content: space-between; }
  .list-head h2 { margin: 0; font-size: 15px; }
  .list-head .sub { color: var(--muted); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .fchip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .fchip:hover { background: var(--hover); }
  .fchip.active { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); font-weight: 600; }
  .fchip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .fchip .n.hot { background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; font-weight: 700; }
  .chips.ticket-sources { margin: 0 0 20px; }

  .card { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 3px solid transparent; }
  .card:hover { background: var(--hover); }
  .card.selected { background: var(--accent-soft); border-left-color: var(--accent); }
  .card-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
  .card-top .proj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-top .time { margin-left: auto; white-space: nowrap; }
  .card-title { font-weight: 600; margin: 3px 0 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .card-bottom .grow { margin-right: auto; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .pill { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
  .pill.red { background: var(--red-soft); color: var(--red); border-color: var(--red-border); }
  .pill.orange { background: var(--orange-soft); color: var(--orange); border-color: var(--orange-border); }
  .pill.yellow { background: var(--yellow-soft); color: var(--yellow); border-color: var(--yellow-border); }
  .pill.green { background: var(--green-soft); color: var(--green); border-color: var(--green-border); }
  .pill.gray { background: var(--gray-soft); color: var(--text-2); border-color: var(--border); }
  .pill.accent { background: var(--accent-soft); color: var(--accent-text); }
  .pill.label { background: var(--surface-2); color: var(--text-2); border-color: var(--border); font-weight: 500; }
  .sev-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- Détail ---------- */
  .detail-pane { display: flex; flex-direction: column; }
  .detail { padding: 24px 32px 32px; max-width: 1400px; width: 100%; flex: 1; }
  .empty { height: 100%; min-height: 200px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px; }
  .empty svg { opacity: .5; margin-bottom: 10px; }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .detail h1 { font-size: 21px; line-height: 1.3; margin: 6px 0 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; }
  .meta span { white-space: nowrap; }
  .btn-link { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text); background: var(--surface); font-weight: 500; white-space: nowrap; }
  .btn-link:hover { background: var(--hover); text-decoration: none; }
  .crumbs .btn-link { margin-left: auto; }

  .callout { margin: 20px 0; border-radius: var(--radius); padding: 14px 16px; border: 1px solid; display: grid; grid-template-columns: 22px 1fr; gap: 4px 10px; align-items: start; }
  .callout h3 { margin: 0; font-size: 14.5px; }
  .callout > :not(svg):not(h3):not(.pulse) { grid-column: 2; }
  .callout p, .callout ul { margin: 2px 0 0; color: var(--text-2); }
  .callout ul { padding-left: 18px; }
  .callout pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 12.5px; color: var(--text-2); }
  .callout .actions-inline { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .callout.warn { background: var(--orange-soft); border-color: var(--orange-border); }
  .callout.warn h3, .callout.warn > svg { color: var(--orange); }
  .callout.ok { background: var(--green-soft); border-color: var(--green-border); }
  .callout.ok h3, .callout.ok > svg { color: var(--green); }
  .callout.err { background: var(--red-soft); border-color: var(--red-border); }
  .callout.err h3, .callout.err > svg { color: var(--red); }
  .callout.info { background: var(--surface-2); border-color: var(--border); }
  .callout.live { background: var(--accent-soft); border-color: transparent; }
  .callout.live h3 { color: var(--accent-text); }
  .callout.live .pulse { color: var(--accent); margin: 6px 0 0 6px; }

  section.block { margin-top: 24px; }
  section.block > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .panel p { margin: 0; }
  .panel.md p { margin: 0 0 10px; }
  .panel.md ul, .panel.md ol { margin: 4px 0 10px; padding-left: 20px; }
  .panel.md li + li { margin-top: 5px; }
  .panel.md li > ul, .panel.md li > ol { margin: 5px 0 0; }
  .panel.md > :last-child { margin-bottom: 0; }
  .panel textarea.area { width: 100%; min-height: 110px; margin-top: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font: inherit; resize: vertical; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li + li { margin-top: 4px; }

  .finding { background: var(--surface); border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .finding + .finding { margin-top: 10px; }
  .finding.blocking { border-left-color: var(--red); }
  .finding.important { border-left-color: var(--orange); }
  .finding.suggestion { border-left-color: var(--yellow); }
  .finding-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .finding-head h3 { margin: 0; font-size: 14.5px; flex-basis: 100%; }
  .loc { display: inline-block; margin: 8px 0 6px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); word-break: break-all; }
  .finding p { margin: 4px 0 0; color: var(--text-2); }
  .fix { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--green-soft); border: 1px solid var(--green-border); }
  .fix b { color: var(--green); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 2px; }
  .positives li::marker { content: "✓  "; color: var(--green); font-weight: 700; }

  .cmd { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .cmd code { flex: 1; background: none; padding: 0; word-break: break-all; }

  .journal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-height: 420px; overflow-y: auto; padding: 6px 0; box-shadow: var(--shadow); }
  .ev { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 5px 14px; align-items: baseline; }
  .ev .ic { text-align: center; color: var(--muted); }
  .ev .t { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .ev.step { font-weight: 600; }
  .ev.step .ic { color: var(--accent); }
  .ev.text .body { color: var(--text-2); white-space: pre-wrap; }
  .ev.tool .body { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; color: var(--text-2); word-break: break-all; }
  .ev.error { color: var(--red); }
  .ev.error .ic { color: var(--red); }

  /* ---------- Barre d'actions ---------- */
  .actionbar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: var(--hover); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--red); border-color: var(--red-border); }
  .btn.ghost { border-color: transparent; color: var(--text-2); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .spacer { flex: 1; }
  .feedback { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .btn.vote.on-yes { background: var(--green-soft); border-color: var(--green-border); color: var(--green); }
  .btn.vote.on-no { background: var(--red-soft); border-color: var(--red-border); color: var(--red); }

  /* ---------- Tickets ---------- */
  .page { height: 100%; overflow-y: auto; }
  .page-inner { padding: 24px 32px 48px; }
  .page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .page-head .sub { color: var(--muted); font-size: 13px; }
  .search { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); min-width: 220px; font: inherit; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; align-items: start; }
  .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-weight: 600; }
  .col-head .badge { margin-left: auto; }
  .ticket { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
  .ticket + .ticket { margin-top: 8px; }
  .ticket .card-title a { color: var(--text); }
  .ticket .labels { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .ticket-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px; }
  .muted-link { font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; }

  /* ---------- Paramètres ---------- */
  .settings { max-width: 1240px; margin: 0 auto; }
  .card-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; box-shadow: var(--shadow); margin-bottom: 20px; scroll-margin-top: 24px; }
  .card-section > h2 { margin: 0 0 4px; font-size: 16px; }
  .card-section > .desc { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; max-width: 110ch; line-height: 1.55; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 22px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-weight: 600; font-size: 13px; }
  .field small { color: var(--muted); font-size: 12px; }
  .field input, .field select, .field textarea { height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font: inherit; }
  .field textarea { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .field textarea.prose { font-family: inherit; font-size: 14px; }
  .sub-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin: 4px 0 10px; }
  .radios { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .radio { border: 1px solid var(--border-strong); border-radius: 10px; padding: 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .radio input { margin-top: 3px; accent-color: var(--accent); }

<script>
/* =====================================================================
   Constantes
   ===================================================================== */
const REVIEW_STATUS = {
  needs_human: { label: "À analyser", pill: "orange" },
  detected: { label: "À lancer", pill: "accent" },
  auto_ok: { label: "Mineur / OK", pill: "green" },
  queued: { label: "En file", pill: "gray" },
  running: { label: "En cours", pill: "accent" },
  error: { label: "Erreur", pill: "red" },
  published: { label: "Commentée", pill: "gray" },
  approved: { label: "Approuvée", pill: "green" },
  dismissed: { label: "Ignorée", pill: "gray" },
};
/** Déclenchement des reviews : libellé et explication de chaque choix. */
const TRIGGER = {
  all: ["Toutes", "Chaque demande de fusion où tu es relecteur est analysée dès qu'elle passe en Ready (comportement d'origine)."],
  configured: ["Projets configurés seulement", "Seules les demandes des projets ajoutés dans Paramètres > Projets sont analysées. Les autres sont ignorées, sans trace."],
  manual: ["À la main", "Les demandes sont détectées et listées « À lancer » : l'agent ne démarre que quand tu cliques sur « Lancer la review »."],
};
const REVIEW_FILTERS = ["needs_human", "detected", "auto_ok", "running", "queued", "error", "published", "approved", "dismissed", ""];
const TASK_STATUS = {
  queued: { label: "En attente", pill: "gray" },
  running: { label: "En cours", pill: "accent" },
  mr_created: { label: "MR créée", pill: "green" },
  mr_updated: { label: "MR mise à jour", pill: "green" },
  blocked: { label: "Bloquée", pill: "orange" },
  error: { label: "Erreur", pill: "red" },
  cancelled: { label: "Arrêtée", pill: "gray" },
};
const COLUMNS = [
  ["todo", "À traiter"],
  ["inProgress", "En cours"],
  ["techValidation", "Validation technique"],
  ["other", "Autres"],
];
const SEV = { blocking: { label: "Bloquant", pill: "red" }, important: { label: "Important", pill: "orange" }, suggestion: { label: "Suggestion", pill: "yellow" } };
const VERDICT = { approve: { label: "Approve", pill: "green" }, approve_with_reservations: { label: "Approve avec réserves", pill: "orange" }, request_changes: { label: "Request changes", pill: "red" } };
const MODE = {
  shadow: ["Mode ombre", "Rien n'est posté sur la forge sans ton clic."],
  comment: ["Mode commentaire", "Les reviews « mineur / OK » sont commentées automatiquement, jamais approuvées."],
  auto: ["Mode auto", "Les reviews « mineur / OK » sont commentées ET approuvées automatiquement."],
};
const EFFORT_LABEL = { low: "Faible", medium: "Moyen", high: "Élevé (plafond)" };
const FORGE_NAME = { gitlab: "GitLab", github: "GitHub" };
const forgeName = (source) => FORGE_NAME[source] || source || "GitLab";
/** Numéro d'une demande de fusion : !12 chez GitLab, #12 chez GitHub. */
const mrPrefix = (source) => (source === "github" ? "#" : "!");
/** Clé d'un projet configuré : le même numéro peut exister chez deux forges. */
const projectKey = (p) => `${p.source}:${p.projectId}`;
/** Plusieurs forges configurées : la forge est indiquée sur les cartes, avec une seule elle serait du bruit. */
const forgePill = (source) => ((state.stats?.forges?.length || 0) > 1 ? `<span class="pill gray">${esc(forgeName(source))}</span>` : "");
const ICON = {
  warn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>',
  err: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  ext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  doc: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6M9 16h6M10 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6h-4z"/><path d="M14 3v6h6"/></svg>',
};

/* =====================================================================
   Utilitaires
   ===================================================================== */
// Tout ce qui vient de GitLab ou du modèle est échappé avant affichage
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Échappe puis rend le `code` et le **gras** inline (sûr : appliqué sur du texte déjà échappé)
const rich = (s) => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");

/** Markdown minimal des textes de l'agent : paragraphes, listes (imbriquées, numérotées), gras, code. */
function md(s) {
  const out = [];
  const stack = [];
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(rich).join("<br>")}</p>`); para = []; } };
  const closeTo = (depth) => { while (stack.length > depth) out.push(`</li></${stack.pop().tag}>`); };
  for (const line of String(s ?? "").split("\n")) {
    const item = line.match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
    if (item) {
      flush();
      const indent = item[1].length;
      const tag = /\d/.test(item[2]) ? "ol" : "ul";
      while (stack.length && stack[stack.length - 1].indent > indent) out.push(`</li></${stack.pop().tag}>`);
      const top = stack[stack.length - 1];
      if (!top || indent > top.indent) { out.push(`<${tag}><li>`); stack.push({ indent, tag }); }
      else out.push("</li><li>");
      out.push(rich(item[3]));
    } else if (!line.trim()) {
      flush();
      closeTo(0);
    } else if (stack.length && /^\s+\S/.test(line)) {
      out.push(" " + rich(line.trim()));
    } else {
      closeTo(0);
      para.push(line.trim());
    }
  }
  flush();
  closeTo(0);
  return out.join("");
}
const pill = (cls, text) => `<span class="pill ${cls}">${text}</span>`;
const slugify = (t, max = 50) => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, max).replace(/-+$/g, "");
const renderTpl = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => ({ iid: String(v.iid), title: v.title, slug: slugify(v.title), summary: v.summary ?? v.title })[k] ?? m);
const lines = (s) => String(s || "").split("\n").map((x) => x.trim()).filter(Boolean);

function ago(date) {
  if (!date) return "";
  const d = new Date(/Z|[+-]\d\d:?\d\d$/.test(date) ? date : String(date).replace(" ", "T") + "Z");
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "x-review-agent": "1" }, body: JSON.stringify(body),
  });
  if (res.status === 401) {
    location.href = "/login";
    throw new Error("Connexion requise");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(message, isError = false) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = message;
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), isError ? 8000 : 3500);
}

/* =====================================================================
   Pièces jointes : captures d'écran, maquettes et données, pour l'agent dev et pour les tickets du Scribe.
   Un fichier envoyé reste « en attente » côté serveur jusqu'à ce qu'on le rattache à une tâche ou à un ticket.
   ===================================================================== */
const ATT = { maxBytes: 8 * 1024 * 1024, maxFiles: 8, accept: ".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.md,.csv,.tsv,.json,.log,.yml,.yaml,.xml" };
const attBoxes = new Map();
let attSeq = 0;

const fmtSize = (n) => (n < 1024 ? `${n} o` : n < 1048576 ? `${Math.round(n / 1024)} Ko` : `${(n / 1048576).toFixed(1).replace(".", ",")} Mo`);

/** Envoie un fichier au serveur : il est contrôlé là-bas (type, taille, contenu réel). @returns { id, name, size, kind } */
async function sendAttachment(file) {
  const res = await fetch(`/api/attachments?name=${encodeURIComponent(file.name)}`, {
    method: "POST", headers: { "Content-Type": "application/octet-stream", "x-review-agent": "1" }, body: file,
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("Connexion requise"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || res.statusText);
  return data;
}

/**
 * Zone de pièces jointes : bouton, glisser-déposer et collage d'une capture (Ctrl+V). `html()` donne le rendu, `onChange` est appelé à chaque
 * changement pour le redessiner. Les fichiers d'une capture collée reçoivent un nom daté.
 * @param onChange Appelé quand la liste, l'envoi ou l'erreur changent.
 * @returns { id, ids(), busy, files, add(list), remove(id), discardAll(), reset(), dispose(), html() }
 */
function createAttachments(onChange = () => {}) {
  const id = `att${++attSeq}`;
  const box = { id, files: [], pending: [], error: "" };
  const changed = () => { try { onChange(); } catch { /* la zone n'est plus affichée */ } };
  const stamp = () => new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);

  box.add = async (list) => {
    box.error = "";
    for (const original of list) {
      // Une capture collée s'appelle « image.png » : on lui donne un nom daté, unique
      const file = !original.name || /^image\.(png|jpe?g|gif|webp)$/i.test(original.name)
        ? new File([original], `capture-${stamp()}-${box.files.length + box.pending.length + 1}.${(original.type.split("/")[1] || "png").replace("jpeg", "jpg")}`, { type: original.type })
        : original;
      if (box.files.length + box.pending.length >= ATT.maxFiles) { box.error = `${ATT.maxFiles} fichiers au plus.`; break; }
      if (file.size > ATT.maxBytes) { box.error = `« ${file.name} » est trop gros (${fmtSize(file.size)} ; ${fmtSize(ATT.maxBytes)} au plus).`; continue; }
      const pending = { key: `${id}-${box.pending.length}-${Date.now()}`, name: file.name };
      box.pending.push(pending);
      changed();
      try { box.files.push(await sendAttachment(file)); }
      catch (err) { box.error = err.message; }
      box.pending = box.pending.filter((p) => p !== pending);
      changed();
    }
  };
  box.remove = (fileId) => {
    box.files = box.files.filter((f) => f.id !== fileId);
    api(`/api/attachments/${fileId}/discard`, {}).catch(() => undefined);
    changed();
  };
  /** Retire du serveur les fichiers en attente (la personne a annulé). */
  box.discardAll = () => { for (const f of box.files) api(`/api/attachments/${f.id}/discard`, {}).catch(() => undefined); box.files = []; };
  /** Vide la liste sans rien supprimer : les fichiers ont été rattachés à une tâche ou à un ticket. */
  box.reset = () => { box.files = []; box.error = ""; changed(); };
  box.dispose = () => attBoxes.delete(id);
  box.ids = () => box.files.map((f) => f.id);
  Object.defineProperty(box, "busy", { get: () => box.pending.length > 0 });
  box.html = () => {
    const chips = [
      ...box.files.map((f) => `<span class="att-chip" title="${esc(f.name)}"><span class="att-name">${esc(f.name)}</span> <small>${fmtSize(f.size)}</small><button type="button" data-att-del="${esc(f.id)}" data-att-box="${id}" aria-label="Retirer ${esc(f.name)}">×</button></span>`),
      ...box.pending.map((p) => `<span class="att-chip busy"><span class="att-name">${esc(p.name)}</span> <small>envoi…</small></span>`),
    ].join("");
    return `<div class="att-zone" data-att-box="${id}">${chips ? `<div class="att-list">${chips}</div>` : ""}<button type="button" class="att-add" data-att-add data-att-box="${id}">＋ Joindre des fichiers</button>
      <span class="att-hint">ou glisse-les ici, ou colle une capture (Ctrl+V). Images, PDF, texte, CSV, JSON : ${fmtSize(ATT.maxBytes)} au plus chacun.</span>${box.error ? `<div class="att-err" role="alert">${esc(box.error)}</div>` : ""}</div>`;
  };
  attBoxes.set(id, box);
  return box;
}

// Écouteurs communs à toutes les zones (le tableau de bord, la forge et le Scribe redessinent leur HTML : on délègue au document)
document.addEventListener("click", (ev) => {
  const add = ev.target.closest?.("[data-att-add]");
  if (add) {
    const box = attBoxes.get(add.dataset.attBox);
    if (!box) return;
    const input = document.createElement("input");
    input.type = "file"; input.multiple = true; input.accept = ATT.accept;
    input.addEventListener("change", () => box.add([...input.files]));
    input.click();
    return;
  }
  const del = ev.target.closest?.("[data-att-del]");
  if (del) attBoxes.get(del.dataset.attBox)?.remove(del.dataset.attDel);
});
for (const type of ["dragenter", "dragover"]) {
  document.addEventListener(type, (ev) => {
    const zone = ev.target.closest?.(".att-zone");
    if (!zone || !ev.dataTransfer?.types?.includes("Files")) return;
    ev.preventDefault();
    zone.classList.add("drag");
  });
}
document.addEventListener("dragleave", (ev) => ev.target.closest?.(".att-zone")?.classList.remove("drag"));
document.addEventListener("drop", (ev) => {
  const zone = ev.target.closest?.(".att-zone");
  if (!zone) return;
  ev.preventDefault();
  zone.classList.remove("drag");
  attBoxes.get(zone.dataset.attBox)?.add([...ev.dataTransfer.files]);
});
// Une capture collée (Ctrl+V) va dans la zone du dialogue ouvert, sinon dans la dernière zone visible
document.addEventListener("paste", (ev) => {
  const files = [...(ev.clipboardData?.files ?? [])];
  if (!files.length) return;
  const zone = document.querySelector("dialog[open] .att-zone") ?? [...document.querySelectorAll(".att-zone")].filter((z) => z.offsetParent !== null).pop();
  if (!zone) return;
  ev.preventDefault();
  attBoxes.get(zone.dataset.attBox)?.add(files);
});

/**
 * Dialogue de confirmation. `html` doit être construit avec esc() pour tout contenu externe. Avec `attach`, le dialogue propose de joindre des
 * fichiers (captures, maquettes, données) : le résultat porte alors `attachments`, la liste des identifiants envoyés.
 */
function ask({ title, html = "", okLabel = "Confirmer", input = false, placeholder = "", attach = false }) {
  const dlg = document.getElementById("dialog");
  document.getElementById("dlg-title").textContent = title;
  document.getElementById("dlg-text").innerHTML = html + (attach ? '<div id="dlg-attach"></div>' : "");
  const ok = document.getElementById("dlg-ok");
  ok.textContent = okLabel;
  ok.disabled = false;
  const area = document.getElementById("dlg-input");
  area.hidden = !input;
  area.value = "";
  area.placeholder = placeholder;
  let box = null;
  if (attach) {
    const paint = () => {
      const holder = document.getElementById("dlg-attach");
      if (holder) holder.innerHTML = box.html();
      ok.disabled = box.busy; // pas de validation pendant un envoi : le fichier serait oublié
    };
    box = createAttachments(paint);
    paint();
  }
  dlg.showModal();
  if (input) area.focus();
  return new Promise((resolve) => {
    dlg.addEventListener("close", () => {
      const accepted = dlg.returnValue === "ok";
      if (box) { if (!accepted) box.discardAll(); box.dispose(); }
      resolve(accepted ? { value: area.value.trim(), attachments: box ? box.ids() : [] } : null);
    }, { once: true });
  });
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copié."); } catch { toast("Copie impossible : sélectionne le texte à la main.", true); }
}

function renderTickets() {
  const root = document.getElementById("view-tickets");
  const q = state.ticketSearch.toLowerCase();
  const matching = state.issues.filter((i) => !q || `${i.title} ${i.projectPath} #${i.iid}`.toLowerCase().includes(q));
  // Filtre par forge : proposé dès que plusieurs forges sont connectées ; un choix retenu pour une forge disparue est ignoré
  const sources = [...new Set([...(state.stats?.forges || []).map((f) => f.kind), ...state.issues.map((i) => i.source)])];
  const source = sources.includes(state.ticketSource) ? state.ticketSource : "";

  const sourceChips = sources.length > 1
    ? `<div class="chips ticket-sources">${["", ...sources].map((k) => `<button class="fchip ${k === source ? "active" : ""}" data-tsource="${esc(k)}">${k ? esc(forgeName(k)) : "Toutes"}<span class="n">${k ? matching.filter((i) => i.source === k).length : matching.length}</span></button>`).join("")}</div>`
    : "";
  const wf = state.settingsCache?.workflow;
  const notConfigured = wf && !wf.todoLabels.length && !wf.inProgressLabels.length;

  const card = (i) => {
    const active = i.task && (i.task.status === "running" || i.task.status === "queued");
    const taskBadge = i.task
      ? `<a href="#dev/${i.task.id}" class="pill ${TASK_STATUS[i.task.status].pill}" title="Voir la tâche de l'agent">${i.task.status === "running" ? '<span class="pulse"></span>' : ""}Agent : ${TASK_STATUS[i.task.status].label}</a>`
      : "";
    const hasMr = Boolean(i.task?.mrIid);
    // Où en est la MR de l'agent (à relire, à corriger, relue OK, fusionnée) : la suite se fait depuis la page de la tâche
    const mrState = hasMr ? pieceBadge(i.task.piece) : null;
    const mrTag = mrState ? `<a href="#dev/${i.task.id}" class="pill ${mrState[0]}" title="Relire, corriger avec la relecture ou fusionner : depuis la tâche de l'agent">${esc(mrState[1])}</a>` : "";
    const action = i.devReady
      ? (active ? "" : hasMr
        ? (i.task.piece?.state === "merged" ? "" : `<a class="btn sm" href="#dev/${i.task.id}" title="Relire la MR, corriger avec la relecture, la reprendre avec tes consignes ou la fusionner">Relire, corriger, fusionner</a>`)
        : `<button class="btn primary sm" data-launch="${i.source}:${i.projectId}:${i.iid}">${i.task ? "Relancer l'agent" : "Traiter avec l'agent"}</button>`)
      : `<button class="muted-link" data-configure="${esc(i.projectPath)}" data-configure-source="${esc(i.source)}">Configurer le projet</button>`;
    return `<div class="ticket">
      <div class="card-top">${forgePill(i.source)}<span class="proj">${esc(i.projectPath)}</span><span>·</span><span>#${i.iid}</span><span class="time">${ago(i.updatedAt)}</span></div>
      <div class="card-title"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
      ${i.labels.length ? `<div class="labels">${i.labels.slice(0, 4).map((l) => `<span class="pill label">${esc(l)}</span>`).join("")}${i.labels.length > 4 ? `<span class="pill label">+${i.labels.length - 4}</span>` : ""}</div>` : ""}
      <div class="ticket-foot">${taskBadge ? taskBadge + mrTag : `<span class="note" style="margin:0">${i.milestone ? esc(i.milestone) : ""}</span>`}${action}</div>
    </div>`;
  };

  const cols = COLUMNS.map(([key, label]) => {
    const items = issues.filter((i) => i.column === key);
    if (key === "other" && !items.length) return "";
    return `<div class="col"><div class="col-head">${label}<span class="badge">${items.length}</span></div>
      ${items.length ? items.map(card).join("") : `<div class="note" style="padding:6px">Aucun ticket.</div>`}</div>`;
  }).join("");

  root.innerHTML = `<div class="page"><div class="page-inner">
    <div class="page-head">
      <div><h1>Mes tickets</h1><div class="sub">Tickets ouverts qui te sont assignés${state.issuesAt ? ` · mis à jour ${ago(state.issuesAt.toISOString())}` : ""}</div></div>
      <span class="spacer"></span>
      <input class="search" id="ticket-search" placeholder="Filtrer (titre, projet, #numéro)" value="${esc(state.ticketSearch)}">
      <button class="btn" data-act="refresh-tickets">Actualiser</button>
      <a class="btn primary" href="#tickets/new" title="Le Scribe rédige un ticket (ou un projet) à partir de ton idée, tu relis avant qu'il soit créé">Nouveau ticket</a>
    </div>
    ${sourceChips}
    ${notConfigured ? `<div class="callout info">${ICON.info}<h3>Range tes tickets par statut</h3><p>Indique les labels de ton workflow (« à traiter », « en cours ») dans <a href="#settings">Paramètres</a> : en attendant, ils sont tous dans « Autres ».</p></div>` : ""}
    ${state.issues.length ? `<div class="board">${cols}</div>` : `<div class="empty">Aucun ticket ouvert ne t'est assigné.</div>`}
  </div></div>`;
}

/**
 * Où en est la MR faite par l'agent dev, en un mot, pour la carte d'un ticket.
 * @param {object|null} p Résumé de la MR renvoyé avec le ticket (`state`, `review`), ou null s'il est inconnu.
 * @returns {[string, string]|null} La couleur de la pastille et son texte, ou null quand l'état n'est pas connu.
 */
function pieceBadge(p) {
  if (!p || p.state === "unknown") return null;
  if (p.state === "merged") return ["green", "MR fusionnée"];
  if (p.state === "closed") return ["gray", "MR fermée"];
  const r = p.review;
  if (!r) return ["gray", "À relire"];
  if (["queued", "running", "detected"].includes(r.status)) return ["accent", "Relecture en cours"];
  if (r.current === false) return ["gray", "À relire (nouveau commit)"];
  if (r.status === "error") return ["red", "Relecture échouée"];
  if (r.status === "dismissed") return ["gray", "Relecture ignorée"];
  if (r.status === "needs_human") return ["orange", "À corriger"];
  return ["green", "Relue OK"];
}

async function launchAgent(source, projectId, iid) {
  const i = state.issues.find((x) => x.source === source && x.projectId === projectId && x.iid === iid);

  const answer = await ask({
    title: `Lancer l'agent sur #${i.iid}`,
    okLabel: "Lancer l'agent",
    input: true,
    attach: true,
    placeholder: "Consignes supplémentaires (optionnel) : piste à explorer, fichiers concernés, contraintes...",
    html: `<p><b>${esc(i.title)}</b></p>
      <dl class="kv">
        <dt>Projet</dt><dd>${esc(i.projectPath)}</dd>
        <dt>Branche créée</dt><dd><code>${esc(i.branchPreview)}</code></dd>
        <dt>Depuis</dt><dd><code>${esc(i.baseBranch)}</code></dd>
        <dt>MR Draft vers</dt><dd><code>${esc(i.targetBranch)}</code></dd>
      </dl>
      <p class="note">L'agent lit le ticket et sa discussion, code sur cette branche, puis l'outil la pousse et ouvre une MR <b>Draft</b>. Aucune autre branche n'est touchée. Tu passes la MR en Ready après contrôle.</p>`,
  });
  if (!answer) return;
  try {
    const { id } = await api("/api/tasks", { source, projectId, issueIid: iid, extraInstructions: answer.value, attachments: answer.attachments });
    toast("Agent lancé.");
    state.issues = null;
    go(`#dev/${id}`);
  } catch (err) { toast(err.message, true); }
}

    : `<div class="empty"><div>Aucune tâche pour l'instant.<br>Lance l'agent depuis l'onglet <a href="#tickets">Tickets</a>.</div></div>`;
}

function renderTaskEmpty() {
  document.getElementById("dev-split").classList.remove("has-selection");
  document.getElementById("dev-detail").innerHTML = `<div class="empty"><div>${ICON.doc}<div>Sélectionne une tâche pour suivre l'agent.</div></div></div>`;
}

function taskCallout(t) {
  const res = t.result;
  switch (t.status) {
    case "running":
      return `<div class="callout live"><span class="pulse"></span><h3>L'agent travaille sur le ticket</h3><p>Le journal ci-dessous se met à jour en direct.</p></div>`;
    case "queued":
      return `<div class="callout info">${ICON.info}<h3>En attente</h3><p>L'agent démarre dès que la tâche précédente est terminée.</p></div>`;
    case "mr_created":
      return `<div class="callout ok">${ICON.ok}<h3>MR Draft ${mrPrefix(t.source)}${t.mr_iid} créée</h3><p>Contrôle-la, puis passe-la en Ready : le ticket passera en Validation technique. Des corrections à faire ? Utilise « Reprendre avec des consignes » plus bas.</p>
        <div class="actions-inline"><a class="btn primary sm" href="${esc(t.mr_url)}" target="_blank" rel="noopener">Ouvrir la MR ${ICON.ext}</a></div></div>`;
    case "mr_updated":
      return `<div class="callout ok">${ICON.ok}<h3>Nouveau commit poussé sur la MR ${mrPrefix(t.source)}${t.mr_iid}</h3><p>Le rapport de la reprise a été ajouté en commentaire sur la MR. Contrôle le nouveau commit avant de passer la MR en Ready.</p>
        <div class="actions-inline"><a class="btn primary sm" href="${esc(t.mr_url)}" target="_blank" rel="noopener">Ouvrir la MR ${ICON.ext}</a></div></div>`;
    case "blocked":
      return `<div class="callout warn">${ICON.warn}<h3>L'agent a besoin d'informations</h3><p>Rien n'a été poussé. Complète le ticket (ou donne des consignes) puis relance.</p>
        ${res?.questions?.length ? `<ul>${res.questions.map((q) => `<li>${rich(q)}</li>`).join("")}</ul>` : ""}</div>`;
    case "error":
      return `<div class="callout err">${ICON.err}<h3>La tâche a échoué</h3><pre>${esc(t.error)}</pre><p class="note">Tu peux <b>relancer l'agent</b> (si une branche d'un essai précédent existe encore sans MR, l'outil en prend une nouvelle) ou <b>supprimer cette tâche</b>, avec les boutons en bas de la page.</p></div>`;
    case "cancelled":
      return `<div class="callout info">${ICON.info}<h3>Tâche arrêtée</h3><p>Rien n'a été poussé.</p></div>`;
  }
  return "";
}

const EV_ICON = { step: "●", text: "💬", tool: "›", error: "✕" };
const eventHtml = (e) => `<div class="ev ${e.kind}"><span class="ic">${EV_ICON[e.kind] || "·"}</span><span class="body">${esc(e.text)}</span><span class="t">${esc(String(e.created_at).slice(11, 16))}</span></div>`;

async function showTask(id) {
  const changed = state.taskId !== id;
  state.taskId = id;
  clearTimeout(taskTimer);
  const t = await api(`/api/tasks/${id}`).catch((err) => { toast(err.message, true); return null; });

  const res = t.result;
  const live = t.status === "running" || t.status === "queued";
  document.getElementById("dev-split").classList.add("has-selection");

  const resume = t.session_id && t.worktree_path ? `cd ${t.worktree_path} && claude --resume ${t.session_id}` : "";
  document.getElementById("dev-detail").innerHTML = `
    <div class="detail">
      <button class="btn ghost back" data-act="dev-back">← Retour aux tâches</button>
      <div class="crumbs">
        ${forgePill(t.source)}<span>${esc(t.project_path)}</span><span>·</span><a href="${esc(t.issue_url)}" target="_blank" rel="noopener">Ticket #${t.issue_iid}</a>
        ${pill(TASK_STATUS[t.status].pill, TASK_STATUS[t.status].label)}
        ${t.mr_url ? `<a class="btn-link" href="${esc(t.mr_url)}" target="_blank" rel="noopener">MR ${mrPrefix(t.source)}${t.mr_iid} ${ICON.ext}</a>` : ""}
      </div>
      <h1>${esc(t.issue_title)}</h1>
      <div class="meta">
        ${t.mode === "followup" && t.parent_id ? `<span>reprise de la <a href="#dev/${t.parent_id}">tâche #${t.parent_id}</a></span>` : ""}
        ${t.branch ? `<span>branche <code>${esc(t.branch)}</code></span>` : ""}
        ${t.base_branch ? `<span><code>${esc(t.base_branch)}</code> → <code>${esc(t.target_branch)}</code></span>` : ""}
        ${t.files_changed != null ? `<span>${t.files_changed} fichier(s)</span>` : ""}
        ${t.num_turns != null ? `<span>${t.num_turns} tours</span>` : ""}
        ${t.cost_usd != null ? `<span title="Estimation équivalent API : sur l'abonnement, c'est un indicateur de consommation, pas une facture">≈ ${t.cost_usd.toFixed(2)} $</span>` : ""}
        <span>${ago(t.updated_at)}</span>
      </div>

      ${taskCallout(t)}

      <div id="task-attachments"></div>

      ${t.extra_instructions ? `<section class="block"><h2>${t.mode === "followup" ? "Consignes de la reprise" : "Tes consignes"}</h2><div class="panel md">${md(t.extra_instructions)}</div></section>` : ""}

      ${res && res.status === "done" ? `
        <section class="block"><h2>Ce que l'agent a fait</h2><div class="panel md">${md(res.summary)}</div></section>
        <section class="block"><h2>Tests</h2><div class="panel md">${md(res.tests)}</div></section>
        ${res.notes_for_reviewer.length ? `<section class="block"><h2>Points à vérifier en priorité</h2><div class="panel"><ul>${res.notes_for_reviewer.map((n) => `<li>${rich(n)}</li>`).join("")}</ul></div></section>` : ""}
        ${res.questions.length ? `<section class="block"><h2>Questions ouvertes</h2><div class="panel"><ul>${res.questions.map((q) => `<li>${rich(q)}</li>`).join("")}</ul></div></section>` : ""}
      ` : ""}
      ${res && res.status === "blocked" ? `<section class="block"><h2>Ce que l'agent a compris</h2><div class="panel md">${md(res.summary)}</div></section>` : ""}

      ${t.mr_iid && ["mr_created", "mr_updated"].includes(t.status) && !live ? `<section class="block"><h2>Relecture et fusion</h2><div class="panel" id="piece-box"><div class="note">Chargement…</div></div></section>` : ""}

      ${t.mr_iid && t.branch && !live ? `<section class="block"><h2>Reprendre avec des consignes</h2><div class="panel">
        <p>L'agent repart de la branche <code>${esc(t.branch)}</code> telle qu'elle est sur la forge (tes commits manuels compris), lit les commentaires de la MR, applique tes consignes, puis l'outil pousse <b>un nouveau commit</b> sur la même MR (jamais de --force) et y ajoute son rapport en commentaire. S'il se bloque, rien n'est poussé.</p>
        <textarea class="area" id="followup-text" placeholder="Ex. : ajoute les docblocks complets sur toutes les méthodes créées, aligne le style des accolades sur Model_Price_Rule, et contrôle réellement les plages annoncées dans la feuille Aide (adultes 0-99, stock max ≥ stock min)."></textarea>
        <div id="followup-review"></div>
        <div id="followup-attach"></div>
        <div class="actions-inline" style="margin-top:10px"><button class="btn primary" data-act="task-followup">Lancer la reprise</button></div></div></section>` : ""}

      <section class="block"><h2>Journal ${live ? '<span class="pill accent"><span class="pulse"></span>en direct</span>' : ""}</h2>

      <span class="spacer"></span>
      ${!live && ["error", "cancelled", "blocked"].includes(t.status) ? `<button class="btn primary" data-act="task-relaunch" title="Crée une nouvelle tâche sur le même ticket, avec les mêmes consignes">Relancer l'agent</button>` : ""}
      ${!live ? `<button class="btn danger" data-act="task-delete" title="Supprime la tâche et son journal de l'outil. La branche et la MR sur la forge ne sont pas touchées.">Supprimer cette tâche</button>` : ""}
      ${t.worktree_path && !live ? `<button class="btn ghost" data-act="task-cleanup" title="Supprime le dossier de travail local. La branche poussée sur la forge n'est pas touchée.">Nettoyer le dossier local</button>` : ""}

  if (changed) document.getElementById("dev-detail").scrollTop = 0;

/** Fichiers joints à la tâche (captures, maquettes, données que l'agent a reçus), sous le titre. */
async function loadTaskAttachments(id) {
  const holder = document.getElementById("task-attachments");
  if (!holder) return;
  const { attachments } = await api(`/api/tasks/${id}/attachments`).catch(() => ({ attachments: [] }));
  if (state.taskId !== id || !attachments.length) return;
  holder.innerHTML = `<section class="block"><h2>Pièces jointes de l'agent</h2><div class="panel"><div class="att-saved">${attachments.map((f) => `<span class="att-chip" title="${esc(f.name)}"><span class="att-name">${esc(f.name)}</span> <small>${fmtSize(f.size)}</small></span>`).join("")}</div>
    <p class="note" style="margin-top:8px">L'agent les ouvre pour comprendre le besoin, puis elles sont retirées de son dossier de travail : elles ne partent jamais dans la MR.</p></div></section>`;
}

/** Zone de pièces jointes de la reprise : la même tant qu'on reste sur la même tâche, pour ne pas perdre les fichiers déjà envoyés. */
function mountFollowupAttachments(id) {
  const holder = document.getElementById("followup-attach");
  if (!holder) return;
  if (state.followupFor !== id || !state.followupBox) {
    state.followupBox?.dispose();
    state.followupFor = id;
    state.followupBox = createAttachments(() => {
      const el = document.getElementById("followup-attach");
      if (el && state.followupFor === state.taskId) el.innerHTML = state.followupBox.html();
    });
  }
  holder.innerHTML = state.followupBox.html();
}

/* La MR de l'agent dev : relecture par l'agent de review, état de la CI, fusion dans la branche cible du projet. */
let pieceTimer = null;
function pieceHtml(p, taskId) {
  const rv = p.review;
  const running = rv && ["queued", "running", "detected"].includes(rv.status);
  const stale = rv && !rv.current && !running;
  const stateTag = p.mr.state === "merged" ? pill("green", "Fusionnée") : p.mr.state === "closed" ? pill("orange", "Fermée") : p.mr.draft ? pill("gray", "Brouillon") : pill("green", "Prête");
  const reviewTag = !rv ? pill("gray", "Pas encore relue")
    : running ? pill("accent", "L'agent de review relit…")
      : rv.status === "needs_human" ? pill("orange", "Des points à analyser")
        : rv.status === "error" ? pill("red", "La relecture a échoué")
          : rv.status === "dismissed" ? pill("orange", "Relecture ignorée") : pill("green", "Relecture OK");
  const counts = rv && rv.verdict ? ` · ${rv.blocking} bloquant${rv.blocking > 1 ? "s" : ""}, ${rv.important} important${rv.important > 1 ? "s" : ""}, ${rv.suggestion} suggestion${rv.suggestion > 1 ? "s" : ""}` : "";
  const reviewBtn = p.mr.state !== "opened" || running || p.followup ? ""
    : !rv || stale ? `<button class="btn primary" data-act="piece-review">Faire relire par l'agent de review</button>`
      : `<button class="btn ghost" data-act="piece-review" data-again="1">Relire à nouveau</button>`;
  const sev = { blocking: ["red", "Bloquant"], important: ["orange", "Important"], suggestion: ["gray", "Suggestion"] };
  const findings = rv && rv.findings && rv.findings.length && !running
    ? `<div style="display:grid;gap:8px;margin:8px 0">${rv.findings.map((f) => `<div class="note" style="border-left:4px solid var(--border-strong);padding:6px 10px"><p>${pill(sev[f.severity]?.[0] ?? "gray", (sev[f.severity]?.[1] ?? f.severity) + (f.confirmed ? "" : " · à vérifier"))} <b>${esc(f.title)}</b> <code>${esc(f.location)}</code></p><p>${esc(f.explanation)}</p>${f.suggestion ? `<p>Suggestion : ${esc(f.suggestion)}</p>` : ""}</div>`).join("")}</div>`
    : "";
  const questions = rv && rv.questions && rv.questions.length && !running ? `<p class="note"><b>Questions de la relecture</b></p><ul class="note" style="margin:0 0 8px 18px">${rv.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` : "";
  const fixBtn = p.followup ? `<p class="note">Un agent dev reprend la MR (tâche <a href="#dev/${esc(p.followup.id)}">#${esc(p.followup.id)}</a>).</p>`
    : p.canFix ? `<button class="btn primary" data-act="piece-fix" title="Lance l'agent dev sur la MR avec les points de la relecture. Les consignes écrites dans « Reprendre avec des consignes » ci-dessous sont ajoutées.">Corriger avec la relecture</button>` : "";
  const ci = p.checks.total === 0 ? "aucune intégration continue" : p.checks.failed ? `${p.checks.failed} en échec` : p.checks.pending ? `${p.checks.pending} en cours` : "verte";
  const merge = p.mr.state === "merged" ? `<div class="callout ok">${ICON.ok}<h3>Fusionnée dans <code>${esc(p.mr.targetBranch)}</code></h3><p>Le code est sur la branche principale du projet. L'outil ne déploie rien : la mise en ligne se fait comme d'habitude pour ce projet.</p></div>`
    : p.mr.state === "closed" ? `<p class="note">La MR est fermée : elle ne peut plus être fusionnée.</p>`
      : `<button class="btn primary" data-act="piece-merge" data-target="${esc(p.mr.targetBranch)}" ${p.readiness.ok ? "" : "disabled"}>Fusionner dans ${esc(p.mr.targetBranch)}</button>
         ${p.readiness.ok ? "" : `<ul class="note" style="margin:8px 0 0 18px">${p.readiness.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`}`;
  return `<p>${stateTag} <code>${esc(p.mr.sourceBranch)}</code> vers <code>${esc(p.mr.targetBranch)}</code></p>
    <p><b>1. Relecture</b> ${reviewTag}${esc(counts)} ${stale ? '<span class="note">La MR a changé depuis la dernière relecture.</span>' : ""}</p>
    ${rv && rv.summary && !running ? `<p class="note">${esc(rv.summary)}</p>` : ""}${findings}${questions}
    <div class="actions-inline">${fixBtn}${reviewBtn}${rv ? `<a class="btn ghost" href="#reviews/${rv.id}">Lire la revue complète</a>` : ""}</div>
    <p class="note">La relecture ne publie rien sur la MR : c'est un contrôle avant fusion.</p>
    <p><b>2. Intégration continue</b> : ${ci}</p>
    <p><b>3. Fusion</b></p>${merge}`;
}
/**
 * Dans « Reprendre avec des consignes » : la case pour joindre la relecture du commit actuel. Elle n'existe que si cette relecture a des points à corriger,
 * est cochée d'emblée, et garde le choix de la personne tant que la relecture ne change pas (la page se rafraîchit toute seule).
 * @param {object} p Etat de la MR renvoyé par `/api/tasks/:id/piece`.
 * @returns {void}
 */
function followupReviewOption(p) {
  const holder = document.getElementById("followup-review");
  if (!holder) return;
  const points = (p.review?.findings?.length ?? 0) + (p.review?.questions?.length ?? 0);
  const sig = p.canFix ? `fix:${p.review.id}:${points}` : p.review && p.review.current === false ? "stale" : "none";
  if (holder.dataset.sig === sig) return;
  holder.dataset.sig = sig;
  holder.innerHTML = p.canFix
    ? `<label class="check"><input type="checkbox" id="followup-with-review" checked> Joindre la relecture du commit actuel (${points} point${points > 1 ? "s" : ""})</label>
       <p class="note">L'agent reçoit ces points comme un texte non fiable : il les vérifie un par un dans le code et dit dans son rapport ceux qu'il écarte. Sans cette case, il ne voit que tes consignes et les commentaires publiés sur la MR.</p>`
    : sig === "stale" ? `<p class="note">La dernière relecture porte sur un ancien commit : elle n'est pas jointe. Fais relire la version actuelle pour pouvoir la joindre.</p>` : "";
}

/**
 * Lance la reprise de l'agent dev sur la MR de la tâche affichée : avec les consignes saisies et, si la case est cochée, la relecture du commit actuel
 * (les consignes sont alors facultatives).
 * @returns {Promise<void>}
 */
async function startFollowup() {
  const instructions = document.getElementById("followup-text").value.trim();
  const withReview = Boolean(document.getElementById("followup-with-review")?.checked);
  if (!instructions && !withReview) return toast("Écris d'abord les consignes de la reprise, ou joins la relecture.", true);
  if (state.followupBox?.busy) return toast("Un fichier est encore en cours d'envoi : attends quelques secondes.", true);
  const joined = withReview ? "<p>L'agent reçoit aussi les points de la relecture du commit actuel.</p>" : "";
  if (!(await ask({ title: "Lancer la reprise ?", html: `${joined}<p>L'agent repart de la branche telle qu'elle est sur la forge. Si tout est bon, l'outil pousse un nouveau commit sur la MR et y ajoute un commentaire. S'il se bloque, rien n'est poussé.</p>`, okLabel: "Lancer" }))) return;
  const res = await api(`/api/tasks/${state.taskId}/followup`, { instructions, withReview, attachments: state.followupBox?.ids() ?? [] }).catch((err) => { toast(err.message, true); return null; });
  if (!res) return;
  state.followupBox?.reset();
  toast("Reprise lancée.");
  refreshHeader();
  go(`#dev/${res.id}`);
}

/**
 * « Corriger avec la relecture » : lance l'agent dev sur la MR avec les points de la relecture du commit actuel, plus les consignes déjà écrites dans le
 * champ de reprise (facultatives). Mène à la tâche de reprise pour suivre l'agent.
 * @returns {Promise<void>}
 */
async function fixWithReview() {
  const note = document.getElementById("followup-text")?.value.trim() ?? "";
  if (state.followupBox?.busy) return toast("Un fichier est encore en cours d'envoi : attends quelques secondes.", true);
  try {
    const res = await api(`/api/tasks/${state.taskId}/fix-review`, { note, attachments: state.followupBox?.ids() ?? [] });
    state.followupBox?.reset();
    toast("Un agent dev reprend la MR avec la relecture.");
    refreshHeader();
    go(`#dev/${res.id}`);
  } catch (err) { toast(err.message, true); }
}

async function loadPiece(taskId) {
  clearTimeout(pieceTimer);
  const box = document.getElementById("piece-box");
  if (!box || state.taskId !== taskId) return;
  try {
    const p = await api(`/api/tasks/${taskId}/piece`);
    box.innerHTML = pieceHtml(p, taskId);
    followupReviewOption(p);
    // Statut en direct tant que la MR est ouverte : 3 s pendant une relecture, 6 s sinon
    if (p.mr.state === "opened") pieceTimer = setTimeout(() => loadPiece(taskId), p.review && ["queued", "running", "detected"].includes(p.review.status) ? 3000 : 6000);
  } catch (err) {
    box.innerHTML = `<p class="note">${esc(err.message)}</p>`;
  }
}

async function pollEvents(reset) {
  const box = document.getElementById("journal");
  if (!box || state.taskId == null) return;
  const events = await api(`/api/tasks/${state.taskId}/events?after=${eventsAfter}`).catch(() => []);
  if (reset) box.innerHTML = events.length ? "" : `<div class="note" style="padding:6px 14px">Aucun événement.</div>`;
  if (!events.length) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.insertAdjacentHTML("beforeend", events.map(eventHtml).join(""));
  eventsAfter = events[events.length - 1].id;
  if (atBottom || reset) box.scrollTop = box.scrollHeight;
}

async function tickTask(id) {
  if (state.tab !== "dev" || state.taskId !== id) return;
  const t = await api(`/api/tasks/${id}`).catch(() => null);
  if (!t) return;
  if (t.status !== "running" && t.status !== "queued") return showTask(id);
  await pollEvents(false);
  taskTimer = setTimeout(() => tickTask(id), 2500);
}

/* =====================================================================
   Onglet Reviews
   ===================================================================== */
function cardBadges(r) {
  if (r.status === "running") return pill("accent", '<span class="pulse"></span>Analyse en cours');
  if (r.status === "queued") return pill("gray", "En attente");
  if (r.status === "error") return pill("red", "Échec de la review");
  const s = r.summary;
  if (!s) return "";
  const out = [];
  if (s.injection) out.push(pill("red", "⚠ Manipulation"));
  for (const k of ["blocking", "important", "suggestion"]) {
    if (s[k]) out.push(`<span class="pill ${SEV[k].pill}" title="${SEV[k].label}"><span class="sev-dot"></span>${s[k]}</span>`);
  }
  if (!out.length) out.push(pill("green", "Aucun point"));
  if (!["needs_human", "auto_ok"].includes(r.status)) out.push(pill(REVIEW_STATUS[r.status].pill, REVIEW_STATUS[r.status].label));
  return out.join("");
}

async function refreshReviews() {
  const f = state.reviewFilter;
  const [rows, stats] = await Promise.all([api(`/api/reviews${f ? `?status=${f}` : ""}`), api("/api/stats")]);
  const counts = stats.counts || {};
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  document.getElementById("rev-filters").innerHTML = REVIEW_FILTERS.map((k) => {
    const n = k ? counts[k] || 0 : total;
    if (k && !n && k !== "needs_human" && k !== f) return "";
    return `<button class="fchip ${k === f ? "active" : ""}" data-rfilter="${k}">${k ? REVIEW_STATUS[k].label : "Toutes"}<span class="n ${k === "needs_human" && n ? "hot" : ""}">${n}</span></button>`;
  }).join("");
  document.getElementById("rev-title").textContent = f ? REVIEW_STATUS[f].label : "Toutes les reviews";
  document.getElementById("rev-count").textContent = `${rows.length} MR`;
  document.getElementById("rev-list").innerHTML = rows.length
    ? rows.map((r) => `
      <div class="card ${r.id === state.reviewId ? "selected" : ""}" data-review="${r.id}" tabindex="0">
        <div class="card-top">${forgePill(r.source)}<span class="proj">${esc(r.project_path)}</span><span>·</span><span>${mrPrefix(r.source)}${r.mr_iid}</span><span class="time">${ago(r.updated_at)}</span></div>
        <div class="card-title">${esc(r.mr_title)}</div>
        <div class="card-bottom"><span class="grow">${esc(r.author)}</span>${cardBadges(r)}</div>
      </div>`).join("")
    : `<div class="empty"><div>${f === "needs_human" ? "Rien ne t'attend. 🎉<br><span class='note'>Les MR où tu es reviewer sont détectées dès qu'elles passent en Ready, puis analysées selon le déclenchement choisi dans Paramètres.</span>" : "Aucune review ici."}</div></div>`;
}

function renderReviewEmpty() {
  document.getElementById("rev-split").classList.remove("has-selection");
  document.getElementById("rev-detail").innerHTML = `<div class="empty"><div>${ICON.doc}<div>Sélectionne une merge request pour voir sa review.</div></div></div>`;
}

function reviewCallout(r, reasons) {
  if (r.status === "error") return `<div class="callout err">${ICON.err}<h3>La review a échoué</h3><pre>${esc(r.error)}</pre><p>Tu peux la relancer. Si l'erreur parle d'une limite d'usage, attends que ton quota se libère.</p></div>`;
  if (r.status === "detected") return `<div class="callout"><h3>Pas encore analysée</h3><p>Cette demande a été détectée, mais le déclenchement des reviews est réglé sur « À la main » : lance l'analyse quand tu veux.</p></div>`;
  if (r.status === "running" || r.status === "queued") return `<div class="callout live"><span class="pulse"></span><h3>${r.status === "running" ? "Analyse en cours" : "En attente d'analyse"}</h3><p>Le résultat apparaîtra ici.</p></div>`;
  if (!r.result) return "";
  if (reasons.length) return `<div class="callout warn">${ICON.warn}<h3>Demande ton analyse</h3><ul>${reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return `<div class="callout ok">${ICON.ok}<h3>Points mineurs uniquement</h3><p>Cette MR peut partir sans toi${state.stats?.actionMode === "shadow" ? " (mode ombre : rien n'est posté tant que tu ne cliques pas)" : ""}.</p></div>`;
}

function findingHtml(f) {
  return `<article class="finding ${f.severity}">
    <div class="finding-head">${pill(SEV[f.severity].pill, SEV[f.severity].label)}${f.confirmed ? "" : pill("gray", "À vérifier")}<h3>${rich(f.title)}</h3></div>
    <code class="loc">${esc(f.location)}</code>
    <p>${rich(f.explanation)}</p>
    ${f.suggestion ? `<div class="fix"><b>Correction proposée</b>${rich(f.suggestion)}</div>` : ""}
  </article>`;
}

async function showReview(id) {
  state.reviewId = id;
  const r = await api(`/api/reviews/${id}`).catch((err) => { toast(err.message, true); return null; });
  if (!r) return;
  document.getElementById("rev-split").classList.add("has-selection");
  const res = r.result;
  const reasons = r.decision_reasons ? JSON.parse(r.decision_reasons) : [];
  const order = { blocking: 0, important: 1, suggestion: 2 };
  const findings = res ? [...res.findings].sort((a, b) => order[a.severity] - order[b.severity]) : [];
  const vote = r.feedback_agree == null ? "" : r.feedback_agree ? "yes" : "no";

  document.getElementById("rev-detail").innerHTML = `
    <div class="detail">
      <button class="btn ghost back" data-act="rev-back">← Retour à la liste</button>
      <div class="crumbs">${forgePill(r.source)}<span>${esc(r.project_path)}</span><span>·</span><span>${mrPrefix(r.source)}${r.mr_iid}</span>${pill(REVIEW_STATUS[r.status].pill, REVIEW_STATUS[r.status].label)}
        <a class="btn-link" href="${esc(r.mr_url)}" target="_blank" rel="noopener">Ouvrir dans ${forgeName(r.source)} ${ICON.ext}</a></div>
      <h1>${esc(r.mr_title)}</h1>
      <div class="meta">
        <span>par <b>${esc(r.author)}</b></span><span>commit <code>${esc(r.head_sha.slice(0, 8))}</code></span>
        ${r.changed_lines != null ? `<span>${r.changed_lines} lignes modifiées</span>` : ""}
        ${r.num_turns != null ? `<span>${r.num_turns} tours</span>` : ""}
        ${r.cost_usd != null ? `<span title="Estimation équivalent API : sur l'abonnement, c'est un indicateur de consommation, pas une facture">≈ ${r.cost_usd.toFixed(2)} $</span>` : ""}
        <span>${ago(r.updated_at)}</span>
      </div>
      ${r.devTask ? `<div class="callout info">${ICON.info}<h3>MR faite par l'agent dev</h3><p>Cette MR est celle de la tâche <a href="#dev/${r.devTask.id}">#${r.devTask.id}</a> : depuis sa page, tu peux relancer la relecture, <b>corriger avec cette relecture</b> (l'agent dev reçoit ses points) ou fusionner.</p><div class="actions-inline"><a class="btn primary sm" href="#dev/${r.devTask.id}">Ouvrir la tâche de l'agent</a></div></div>` : ""}
      ${reviewCallout(r, reasons)}
      ${res ? `
        <section class="block"><h2>Résumé ${pill(VERDICT[res.verdict].pill, "Verdict agent : " + VERDICT[res.verdict].label)}</h2><div class="panel md">${md(res.summary)}</div></section>
        ${res.questions_for_author.length ? `<section class="block"><h2>Questions pour l'auteur</h2><div class="panel"><ul>${res.questions_for_author.map((q) => `<li>${rich(q)}</li>`).join("")}</ul></div></section>` : ""}
        <section class="block"><h2>Points relevés (${findings.length})</h2>${findings.length ? findings.map(findingHtml).join("") : `<div class="panel"><p>Aucun point négatif relevé.</p></div>`}</section>
        ${res.positives.length ? `<section class="block"><h2>Points positifs</h2><div class="panel"><ul class="positives">${res.positives.map((p) => `<li>${rich(p)}</li>`).join("")}</ul></div></section>` : ""}` : ""}
    </div>
    <div class="actionbar">
      ${res && !["published", "approved"].includes(r.status) ? `<button class="btn primary" data-act="publish">Publier le commentaire</button>` : ""}
      ${res && r.status !== "approved" ? `<button class="btn" data-act="approve">Publier + approuver</button>` : ""}
      ${r.status === "detected" ? `<button class="btn primary" data-act="start">Lancer la review</button>` : `<button class="btn ghost" data-act="retry">Relancer</button>`}
      ${r.status !== "dismissed" ? `<button class="btn ghost" data-act="dismiss">Ignorer</button>` : ""}
      <span class="spacer"></span>
      ${res ? `<span class="feedback">Décision juste ?
        <button class="btn vote ${vote === "yes" ? "on-yes" : ""}" data-act="agree" title="L'agent a bien jugé">👍</button>
        <button class="btn vote ${vote === "no" ? "on-no" : ""}" data-act="disagree" title="L'agent s'est trompé">👎</button></span>` : ""}
    </div>`;
  document.getElementById("rev-detail").scrollTop = 0;
  refreshReviews();
}

async function reviewAction(action, button) {
  const id = state.reviewId;
  try {
    if (action === "agree") {
      await api(`/api/reviews/${id}/feedback`, { agree: true });
      toast("Noté : décision correcte.");
    } else if (action === "disagree") {
      const a = await ask({ title: "Qu'est-ce que l'agent a mal jugé ?", html: "<p>Ta note sert à améliorer les instructions de review.</p>", okLabel: "Enregistrer", input: true, placeholder: "Ex. : le N+1 n'en est pas un, la relation est déjà chargée par le scope global." });
      if (!a) return;
      await api(`/api/reviews/${id}/feedback`, { agree: false, note: a.value });
      toast("Noté : décision incorrecte.");
    } else {
      if (action === "approve" && !(await ask({ title: "Publier et approuver ?", html: "<p>La review sera postée sur la MR et la MR approuvée en ton nom, pour ce commit précis.</p>", okLabel: "Publier + approuver" }))) return;
      if (button) button.disabled = true;
      await api(`/api/reviews/${id}/${action}`, {});
      toast({ start: "Review lancée.", publish: "Commentaire publié sur la MR.", approve: "Review publiée et MR approuvée.", retry: "Review relancée.", dismiss: "Review ignorée." }[action]);
    }
    await showReview(id);
    refreshHeader();
  } catch (err) {
    if (button) button.disabled = false;
    toast(err.message, true);
  }
}

const term = { xterm: null, source: null, buf: "", timer: null, chain: Promise.resolve(), loading: null, poll: null };

/** Pastille et détail de la connexion de la CLI Claude. */

async function refreshClaudeStatus(force) {
  try {
    const before = state.claude?.connected;

    const row = document.getElementById("claude-status");

/** Charge xterm.js (servi par l'outil, version figée) la première fois qu'on ouvre le terminal. */
function loadXterm() {
  term.loading ??= new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "/vendor/xterm/xterm.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = "/vendor/xterm/xterm.js";
    js.onload = () => resolve();
    js.onerror = () => { term.loading = null; reject(new Error("Impossible de charger le terminal")); };
    document.head.append(js);
  });
  return term.loading;
}

/** Détache le terminal de la page (la session continue sur le serveur). */
function disposeTermView() {
  term.source?.close();
  term.source = null;
  term.xterm?.dispose();
  term.xterm = null;
  clearInterval(term.poll);
  term.poll = null;
}

const base64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

function showTermMessage(text) {
  document.getElementById("term-host").innerHTML = `<p class="note" style="color:#c9d1d9;padding:6px 4px;margin:0">${esc(text)}</p>`;
}

async function openTerminal() {
  const panel = document.getElementById("term-panel");
  if (!panel) return;
  panel.hidden = false;
  try {
    const info = await api("/api/terminal");
    if (!info.available) return showTermMessage(info.reason || "Le terminal n'est pas disponible sur cette machine.");
    await loadXterm();
    disposeTermView();
    const host = document.getElementById("term-host");
    host.innerHTML = "";
    term.xterm = new Terminal({ cols: info.cols, rows: info.rows, cursorBlink: true, fontSize: 13, fontFamily: 'ui-monospace, "Cascadia Code", Consolas, monospace', theme: { background: "#0d1117" } });
    term.xterm.open(host);
    term.xterm.onData(queueTermInput);
    if (!info.active) await api("/api/terminal/start", {});
    attachTermStream();
    term.xterm.focus();
    term.poll = setInterval(() => refreshClaudeStatus(true), 8000);
  } catch (err) {
    showTermMessage(err.message);
    toast(err.message, true);
  }
}

/** Branche le flux de sortie. Pas de reconnexion automatique : elle rejouerait la sortie déjà affichée. */
function attachTermStream() {
  const source = new EventSource("/api/terminal/stream");
  term.source = source;
  source.addEventListener("data", (ev) => term.xterm?.write(base64ToBytes(ev.data)));
  source.addEventListener("exit", () => {
    source.close();
    term.source = null;
    term.xterm?.write("\r\n\x1b[33m[Session terminée]\x1b[0m\r\n");
    refreshClaudeStatus(true);
  });
  source.onerror = () => {
    source.close();
    term.source = null;
    term.xterm?.write("\r\n\x1b[31m[Connexion au terminal perdue : rouvre-le]\x1b[0m\r\n");
  };
}

/** Regroupe les touches tapées sur quelques millisecondes et les envoie dans l'ordre (une requête à la fois). */
function queueTermInput(data) {
  term.buf += data;
  if (term.timer) return;
  term.timer = setTimeout(() => {
    term.timer = null;
    const text = term.buf;
    term.buf = "";
    for (let i = 0; i < text.length;) {
      let end = Math.min(i + 3000, text.length);
      const last = text.charCodeAt(end - 1);
      if (end < text.length && last >= 0xd800 && last <= 0xdbff) end--; // ne coupe pas une paire de substitution
      const part = text.slice(i, end);
      term.chain = term.chain.then(() => api("/api/terminal/input", { data: part })).catch((err) => toast(err.message, true));
      i = end;
    }
  }, 8);
}

function hideTerminal() {
  disposeTermView();
  document.getElementById("term-panel").hidden = true;
}

async function stopTerminal() {
  disposeTermView();
