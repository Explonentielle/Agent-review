/** Enregistre ou supprime un jeton de l'outil, puis met à jour son bloc sans toucher aux autres champs du formulaire. */
async function secretAction(act, name) {
  const input = document.querySelector(`[data-secret-input="${name}"]`);
  try {
    if (act === "secret-save") {
      const value = input?.value.trim();
      if (!value) return toast("Colle d'abord la valeur.", true);
      const res = await api(`/api/secrets/${encodeURIComponent(name)}`, { value });
      toast(res.restartRequired ? "Enregistré, chiffré. Redémarre l'outil pour le prendre en compte." : "Enregistré, chiffré et appliqué.");
      state.issues = null; // les tickets viennent des forges : ils sont rechargés avec les nouvelles connexions
    } else {
      if (!(await ask({ title: "Supprimer ce réglage ?", html: "<p>Il est effacé de la base de l'outil. Pour un jeton, rien n'est révoqué chez GitLab, GitHub ou Anthropic : fais-le là-bas si le jeton a fuité.</p>", okLabel: "Supprimer" }))) return;
      const res = await api(`/api/secrets/${encodeURIComponent(name)}/delete`, {});
      toast(res.restartRequired ? "Supprimé. Redémarre l'outil pour que la forge cesse de l'utiliser." : "Supprimé.");
    }
    await refreshHeader();
    state.secrets = (await api("/api/secrets")).secrets;
    const blocks = { "forges-block": forgesBlock, "secrets-block": secretsBlock, "api-key-state": apiKeyPill };
    for (const [id, render] of Object.entries(blocks)) { const el = document.getElementById(id); if (el) el.innerHTML = render(); }
    document.dispatchEvent(new Event("ra:changed"));
  } catch (err) { toast(err.message, true); }
}

/** Section « Agents dans des conteneurs » : où tournent les agents et, en mode conteneur, le bouton qui vérifie que tout est prêt. */
function runtimeSection() {
  const r = state.runtime;
  const body = !r ? `<p class="note">L'état des conteneurs d'agents est indisponible.</p>`
    : r.mode !== "docker" ? `<p class="note">Les agents tournent directement sur la machine (<code>AGENT_RUNTIME=host</code>). Pour les isoler dans des conteneurs jetables, voir <code>docs/deploiement.md</code>, sections 10 et 11.</p>`
    : (() => {
      const images = r.images || [r.image];
      return `<dl class="kv"><dt>Image par défaut</dt><dd><code>${esc(r.image)}</code></dd>

        <dt>Plafonds par agent</dt><dd>${esc(r.memory)} de mémoire, ${esc(String(r.cpus))} processeur(s), ${esc(String(r.pids))} processus</dd><dt>Utilisateur du conteneur</dt><dd>${esc(r.containerUser)}</dd></dl>
        <div class="actions-inline">${images.map((i) => `<button type="button" class="btn sm" data-act="runtime-check" data-image="${esc(i)}">${images.length > 1 ? `Tester ${esc(i)}` : "Tester les conteneurs"}</button>`).join("")}</div>
        <div id="runtime-result"></div>`;
    })();
  return `<section class="card-section">
        <h2>Agents dans des conteneurs</h2>
        <p class="desc">Chaque review et chaque tâche de dev peut tourner dans un conteneur jetable qui ne voit que son dossier de travail (réglage <code>AGENT_RUNTIME</code> du .env). Le test lance un conteneur d'essai avec les options d'une vraie tâche, et vérifie le mode clé API, Docker, l'image, l'écriture dans le dossier de travail, l'isolation, les plafonds de ressources et la CLI Claude Code.</p>
        ${body}
      </section>`;
}

/** Lance le diagnostic des conteneurs d'agents et affiche un contrôle par ligne. Aucun réglage n'est modifié. */
async function runRuntimeCheck(button) {
  const out = document.getElementById("runtime-result");
  button.disabled = true;
  out.innerHTML = `<p class="note">Essai en cours, quelques secondes...</p>`;
  try {
    const image = button.dataset.image || "";
    const res = await api("/api/agent-runtime/check", { image });
    out.innerHTML = `${image ? `<p class="note">Image testée : <code>${esc(image)}</code></p>` : ""}<div class="check-list">${res.checks.map((c) => `<div class="check-row">${c.ok ? pill("green", "ok") : pill("red", "échec")}<b>${esc(c.label)}</b><span>${esc(c.detail)}</span></div>`).join("")}</div>
      <p class="note">${res.ok ? "Tout est en ordre : les agents peuvent tourner en conteneur." : "Corrige les points en échec, puis relance le test."}</p>`;
  } catch (err) {
    out.innerHTML = "";
    toast(err.message, true);
  } finally {
    button.disabled = false;
  }
}

const ROLE_LABEL = { admin: "Administrateur", member: "Membre", viewer: "Lecteur" };
const ROLE_RANK = { viewer: 0, member: 1, admin: 2 };
const LEVEL_NEED = { read: 0, act: 1, admin: 2 };

/**
 * Le rôle de la personne suffit-il pour ce niveau de droit ? Même règle que le serveur (`auth/permissions.ts`), qui reste seul juge : ceci ne sert qu'à griser ce qui serait refusé.
 * @param {"read"|"act"|"admin"} level Niveau demandé.
 * @returns {boolean} Vrai si le rôle suffit (sans connexion, la personne est administratrice).
 */
const canDo = (level) => ROLE_RANK[state.me?.role ?? "admin"] >= LEVEL_NEED[level];

/** Attribut qui grise une zone des Paramètres quand le rôle ne suffit pas. */
const lockedFor = (level) => (canDo(level) ? "" : "disabled");

/** Bandeau des Paramètres pour qui n'est pas administrateur : ce qui est en lecture seule, et pourquoi. */
function roleBanner() {
  if (canDo("admin")) return "";
  const role = ROLE_LABEL[state.me.role].toLowerCase();
  return `<div class="callout info">${ICON.info}<h3>Tu es ${role} de cet espace</h3><p>${canDo("act") ? "Les réglages de l'espace (modèles, projets, workflow, équipe) sont réservés aux administrateurs : ils s'affichent ici en lecture seule. Tes jetons de forge (Connexion) restent à toi." : "Tout est en lecture seule : tu consultes les tickets, tâches et reviews, sans lancer d'agent ni changer de réglage."} Un administrateur peut changer ton rôle.</p></div>`;
}

/** Qui est connecté, avec quel rôle, dans quel espace : le rôle s'affiche dans l'en-tête si ce n'est pas administrateur, et un sélecteur apparaît quand on a plusieurs espaces. */
async function refreshMe() {
  state.me = await api("/api/me").catch(() => null);
  const list = await api("/api/workspaces").catch(() => null); // sans connexion par compte, cette route n'existe pas : un seul espace
  state.workspaces = list && list.workspaces.length > 1 ? list : null;
  applyMe();
}

/** Met l'en-tête à jour : pastille du rôle et sélecteur d'espace. */
function applyMe() {
  const role = state.me?.role;
  const chip = document.getElementById("role-chip");
  chip.hidden = !role || role === "admin";
  chip.textContent = ROLE_LABEL[role] || "";
  chip.title = role === "viewer" ? "Lecture seule : tu ne peux ni lancer l'agent ni changer les réglages" : "Tu lances les agents ; les réglages de l'espace sont réservés aux administrateurs";
  const sw = document.getElementById("ws-switch");
  sw.hidden = !state.workspaces;
  const options = state.workspaces ? state.workspaces.workspaces.map((w) => `<option value="${w.id}" ${w.id === state.workspaces.active ? "selected" : ""}>${esc(w.name)} (${ROLE_LABEL[w.role].toLowerCase()})</option>`).join("") : "";
  sw.innerHTML = options + (state.workspaces ? `<option value="new">+ Nouvelle organisation</option>` : "");
}

/** Crée une organisation (espace d'équipe) dont on devient l'administrateur, et bascule dessus. */
async function createOrganization() {
  const answer = await ask({ title: "Nouvelle organisation", html: "<p>Tu en seras l'administrateur : tu pourras y inviter des personnes par email, avec le rôle de ton choix. Elle a ses propres projets, réglages et limites.</p>", okLabel: "Créer", input: true, placeholder: "Nom de l'organisation" });
  if (answer && answer.value) {
    try {
      await api("/api/workspaces", { name: answer.value });
      location.reload();
      return;
    } catch (err) {
      toast(err.message, true);
    }
  }
  applyMe();
}

/** Change d'espace de travail : la session désigne l'autre espace, et la page se recharge avec ses données. */
async function switchWorkspace(id) {
  try {
    await api("/api/workspaces/active", { id });
    location.reload();
  } catch (err) {
    toast(err.message, true);
    applyMe();
  }
}

/** Montre ou cache l'onglet de la forge (jeu) selon le drapeau du serveur, et met le monde en pause quand il est éteint. */
function applyGame() {
  document.querySelector('[data-tab="forge"]').hidden = !state.game.enabled;
  if (!state.game.enabled) stopForge();
}

/** Lit le drapeau de la forge (jeu) : en cas d'erreur, elle est considérée éteinte (rien du jeu n'est chargé). */
async function refreshGame() {
  state.game = await api("/api/game").catch(() => ({ enabled: false }));
  applyGame();
}

/**
 * Allume ou éteint la forge (jeu) pour l'espace : son onglet apparaît ou disparaît, et le serveur répond ou non à ses routes.
 * @param {boolean} enabled Vrai pour l'allumer.
 * @returns {Promise<void>}
 */
async function toggleGame(enabled) {
  try {
    state.game = await api("/api/game", { enabled });
    toast(state.game.enabled ? "La forge est allumée." : "La forge est éteinte.");
  } catch (err) {
    toast(err.message, true);
    await refreshGame();
    const box = document.querySelector('[data-act="game-toggle"]');
    if (box) box.checked = state.game.enabled;
  }
  applyGame();
}

}

/** Sommaire des paramètres : un lien par section, celle visible est surlignée au défilement. */
function buildSettingsToc() {
  const toc = document.getElementById("settings-toc");
  const page = document.getElementById("settings-page");
  const sections = [...document.querySelectorAll("#settings .card-section")];
  sections.forEach((sec, i) => { sec.id = `set-${i}`; });
  const shortTitle = (sec) => (sec.querySelector("h2")?.textContent || "").replace(/ (des reviews|de l'agent dev|\(avancé\))$/, "");
  toc.innerHTML = sections.map((sec, i) =>
    `<button type="button" data-toc="${i}" title="${esc(sec.querySelector("h2")?.textContent || "")}">${esc(shortTitle(sec))}</button>`).join("");
  toc.onclick = (e) => {
    const b = e.target.closest("[data-toc]");
    if (b) document.getElementById(`set-${b.dataset.toc}`).scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const highlight = () => {
    const top = page.getBoundingClientRect().top + 120;
    let current = 0;
    sections.forEach((sec, i) => { if (sec.getBoundingClientRect().top <= top) current = i; });
    if (page.scrollTop + page.clientHeight >= page.scrollHeight - 4) current = sections.length - 1;
    toc.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === current));
  };
  page.onscroll = highlight;
  highlight();
}

  const val = (n) => form.elements[n].value;
  let mrTitle = renderTpl(val("templates.mrTitle"), v);
  if (!/^\s*(draft:|\[draft\]|\(draft\))/i.test(mrTitle)) mrTitle = "Draft: " + mrTitle;
  box.innerHTML = `<div><span class="k">Exemple, ticket</span>#163 · ${esc(v.title)}</div>
    <div><span class="k">Branche</span><code>${esc(renderTpl(val("templates.branch"), v))}</code></div>
    <div><span class="k">Commit</span><code>${esc(renderTpl(val("templates.commit"), v))}</code></div>
    <div><span class="k">Titre de MR</span>${esc(mrTitle)}</div>`;
}

function collectSettings() {
  const f = document.getElementById("settings-form").elements;
  const num = (n) => Number(f[n].value);
  const agent = (p) => ({ model: f[`${p}.model`].value, effort: f[`${p}.effort`].value, maxTurns: num(`${p}.maxTurns`), timeoutMin: num(`${p}.timeoutMin`) });
  return {
    actionMode: f.actionMode.value,
    reviewTrigger: f.reviewTrigger.value,
    agentAuth: f.agentAuth.value,
    budget: { monthlyUsd: Number(f["budget.monthlyUsd"].value) || 0 },
    quotas: { perUserMonthlyUsd: Number(f["quotas.perUserMonthlyUsd"].value) || 0, perUserDailyRuns: Math.trunc(Number(f["quotas.perUserDailyRuns"].value) || 0) },
    review: agent("review"),
    dev: agent("dev"),
    rules: { maxChangedLinesAuto: num("rules.maxChangedLinesAuto"), sensitivePaths: lines(f["rules.sensitivePaths"].value) },
    workflow: {
      todoLabels: lines(f["workflow.todoLabels"].value),
      inProgressLabels: lines(f["workflow.inProgressLabels"].value),
      techValidationLabels: lines(f["workflow.techValidationLabels"].value),
      labelOnStart: f["workflow.labelOnStart"].value.trim(),
    },
    instructions: { review: f["instructions.review"].value, dev: f["instructions.dev"].value },
    systemPrompts: { review: f["systemPrompts.review"].value, dev: f["systemPrompts.dev"].value },
    templates: {
      branch: f["templates.branch"].value.trim(),
      commit: f["templates.commit"].value.trim(),
      mrTitle: f["templates.mrTitle"].value.trim(),
      mrDescription: f["templates.mrDescription"].value,
    },
  };
}

async function saveSettings() {
  const data = collectSettings();
  if (data.actionMode !== settingsData.settings.actionMode && data.actionMode !== "shadow") {
    const ok = await ask({ title: `Passer en ${MODE[data.actionMode][0].toLowerCase()} ?`, html: `<p>${esc(MODE[data.actionMode][1])} Les commentaires et approbations seront faits en ton nom.</p>`, okLabel: "Confirmer" });
    if (!ok) return;
  }
  if (!data.templates.branch.includes("{iid}")) return toast("Le nom de branche doit contenir {iid}.", true);
  try {
    const res = await api("/api/settings", data);
    settingsData.settings = res.settings;
    state.settingsCache = res.settings;
    state.issues = null;
    toast("Paramètres enregistrés.");
    refreshHeader();
  } catch (err) { toast(err.message, true); }
}

function openProjectEditor(key, search = "", source = null) {
  editingProject = key ? { ...projectsData.find((p) => projectKey(p) === key) } : null;
  const box = document.getElementById("project-editor");
  if (!editingProject) {
    const kinds = (state.stats?.forges || []).map((f) => f.kind);
    const current = kinds.includes(source) ? source : kinds[0] || "gitlab";
    const forgeField = kinds.length > 1
      ? `<label class="field"><span>Forge</span><select id="project-forge">${kinds.map((k) => `<option value="${k}" ${k === current ? "selected" : ""}>${forgeName(k)}</option>`).join("")}</select></label>`
      : `<input type="hidden" id="project-forge" value="${current}">`;
    box.innerHTML = `<div class="panel" style="margin-top:12px">
      ${forgeField}
      <label class="field"><span>Rechercher un projet</span><input id="project-search" placeholder="Nom du projet" value="${esc(search)}"></label>
      <div class="results" id="project-results" hidden></div></div>`;
    const input = document.getElementById("project-search");
    input.focus();
    let timer;
    const run = () => { clearTimeout(timer); timer = setTimeout(() => searchProjects(input.value), 300); };
    input.addEventListener("input", run);
    document.getElementById("project-forge").addEventListener("change", () => searchProjects(input.value));
    if (search) searchProjects(search.split("/").pop());
    return;
  }
  renderProjectForm();
}

async function searchProjects(q) {
  const box = document.getElementById("project-results");
  if (!box) return;
  if (!q.trim()) { box.hidden = true; return; }
  try {
    const source = document.getElementById("project-forge")?.value || "gitlab";
    const results = await api(`/api/gitlab/projects?source=${source}&search=${encodeURIComponent(q.trim())}`);
    box.hidden = false;
    box.innerHTML = results.length ? results.map((p) => `<button type="button" data-pickproject='${esc(JSON.stringify({ id: p.id, path: p.path, source }))}'>${esc(p.path)}</button>`).join("") : `<div class="note" style="padding:8px 12px">Aucun projet trouvé.</div>`;
  } catch (err) { toast(err.message, true); }
}

/** Champ « image de l'agent » d'un projet : liste des images autorisées en mode conteneur, sinon un champ caché qui garde la valeur enregistrée. */
function agentImageField(p) {
  const r = state.runtime;
  const current = p.agentImage || "";
  if (!r || r.mode !== "docker") return `<input type="hidden" name="agentImage" value="${esc(current)}">`;
  const images = r.images || [r.image];
  return `<label class="field"><span>Image de l'agent (conteneur)</span>
    <select name="agentImage">
      <option value="">Image par défaut (${esc(r.image)})</option>
      ${images.filter((i) => i !== r.image).map((i) => `<option value="${esc(i)}" ${i === current ? "selected" : ""}>${esc(i)}</option>`).join("")}
      ${!current || images.includes(current) ? "" : `<option value="${esc(current)}" selected>${esc(current)} (non autorisée)</option>`}
    </select>
    <small>Les outils du projet (PHP, composer, node...) doivent être dans l'image. Dans un conteneur il n'y a pas de Docker : les commandes autorisées appellent directement les outils (ex. <code>vendor/bin/phpunit</code>), pas <code>docker run</code>. Images proposées : celles de <code>AGENT_IMAGE</code> et <code>AGENT_IMAGES</code> du .env.</small></label>`;
}

async function renderProjectForm() {
  const p = editingProject;
  const box = document.getElementById("project-editor");
  box.innerHTML = `<form class="panel" id="project-form" style="margin-top:12px">
    <div class="sub-title">${forgePill(p.source)} ${esc(p.path)}</div>
    <label class="check"><input type="checkbox" name="devEnabled" ${p.devEnabled ? "checked" : ""}> Autoriser l'agent dev sur ce projet</label>
    <div class="grid2" style="margin-top:14px">
      <label class="field"><span>Branche de départ</span><input name="baseBranch" list="branch-list" value="${esc(p.baseBranch)}" placeholder="ex. develop"><small>La branche du ticket est créée depuis celle-ci.</small></label>
      <label class="field"><span>Branche cible de la MR</span><input name="targetBranch" list="branch-list" value="${esc(p.targetBranch)}" placeholder="ex. global"><small>Global, intermédiaire, master... selon le projet.</small></label>
      <label class="field"><span>Commandes autorisées</span><textarea name="allowedCommands" placeholder="docker run --rm -v {worktree}:/app -w /app php:7.3-cli vendor/bin/phpunit">${esc(p.allowedCommands.join("\n"))}</textarea><small>Une commande par ligne (tests, lint). L'agent pourra y ajouter des arguments. Rien d'autre ne lui est permis. <code>{worktree}</code> est remplacé par le dossier de travail de l'agent : c'est lui qu'il faut monter dans un conteneur, pas ton dossier local (un <code>docker compose exec</code> sur ton conteneur habituel testerait ton code, pas celui de l'agent). Les dépendances non versionnées (<code>vendor/</code>, <code>node_modules/</code>) ne sont pas dans ce dossier.</small></label>
      ${agentImageField(p)}
      <label class="field"><span>Consignes propres au projet</span><textarea class="prose" name="instructions" placeholder="Stack et version, conventions, pièges connus...">${esc(p.instructions)}</textarea><small>Utilisées par l'agent dev et par la review des MR de ce projet.</small></label>
    </div>
    <datalist id="branch-list"></datalist>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn ghost" data-act="project-cancel">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer le projet</button>
    </div>
  </form>`;
  try {
    const branches = await api(`/api/gitlab/projects/${p.projectId}/branches?source=${p.source}`);
    document.getElementById("branch-list").innerHTML = branches.map((b) => `<option value="${esc(b.name)}">${b.protected ? "protégée" : ""}</option>`).join("");
  } catch { /* la saisie libre reste possible */ }
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function saveProject() {
  const f = document.getElementById("project-form").elements;
  const data = {
    source: editingProject.source,
    projectId: editingProject.projectId,
    path: editingProject.path,
    devEnabled: f.devEnabled.checked,
    baseBranch: f.baseBranch.value.trim(),
    targetBranch: f.targetBranch.value.trim(),
    allowedCommands: lines(f.allowedCommands.value),
    instructions: f.instructions.value,
    agentImage: f.agentImage.value,
  };
  try {
    await api("/api/projects", data);
    toast("Projet enregistré.");
    editingProject = null;
    state.issues = null;
    await loadSettings();
    document.dispatchEvent(new Event("ra:changed"));
  } catch (err) { toast(err.message, true); }
}

/* =====================================================================
   Événements
   ===================================================================== */
let lastLabelField = null;

document.addEventListener("focusin", (e) => { if (e.target.matches?.("[data-labels]")) lastLabelField = e.target; });
document.addEventListener("input", (e) => {
  if (e.target.id === "ticket-search") { state.ticketSearch = e.target.value; const pos = e.target.selectionStart; renderTickets(); const el = document.getElementById("ticket-search"); el.focus(); el.setSelectionRange(pos, pos); }
  if (e.target.name?.startsWith("templates.")) updatePreview();
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "settings-form") { e.preventDefault(); saveSettings(); }
  if (e.target.id === "project-form") { e.preventDefault(); saveProject(); }
});

document.addEventListener("click", async (e) => {
  const el = (sel) => e.target.closest(sel);
  let t;
  if ((t = el("[data-tab]"))) return go(`#${t.dataset.tab}`);
  if ((t = el("[data-task]"))) return go(`#dev/${t.dataset.task}`);
  if ((t = el("[data-review]"))) return go(`#reviews/${t.dataset.review}`);
  if ((t = el("[data-rfilter]"))) { state.reviewFilter = t.dataset.rfilter; return refreshReviews(); }
  if ((t = el("[data-tsource]"))) return setTicketSource(t.dataset.tsource);
  if ((t = el("[data-launch]"))) { const [source, p, i] = t.dataset.launch.split(":"); return launchAgent(source, Number(p), Number(i)); }
  if ((t = el("[data-configure]"))) { state.prefillProject = t.dataset.configure; state.prefillSource = t.dataset.configureSource; return go("#settings"); }
  if ((t = el("[data-copy]"))) return copy(t.dataset.copy);
  if ((t = el("[data-addlabel]"))) {
    const field = lastLabelField || document.querySelector("[name='workflow.todoLabels']");
    const current = lines(field.value);
    if (!current.includes(t.dataset.addlabel)) field.value = [...current, t.dataset.addlabel].join("\n");
    return;
  }
  if ((t = el("[data-editproject]"))) return openProjectEditor(t.dataset.editproject);
  if ((t = el("[data-delproject]"))) {
    const p = projectsData.find((x) => projectKey(x) === t.dataset.delproject);
    if (!(await ask({ title: "Supprimer ce projet ?", html: `<p>${esc(p?.path)} ne sera plus traitable par l'agent. Rien n'est supprimé sur la forge.</p>`, okLabel: "Supprimer" }))) return;
    const [forge, projectId] = t.dataset.delproject.split(":");
    await api(`/api/projects/${projectId}/delete?source=${forge}`, {}).catch((err) => toast(err.message, true));
    return loadSettings();
  }
  if ((t = el("[data-pickproject]"))) {
    const picked = JSON.parse(t.dataset.pickproject);
    const existing = projectsData.find((p) => p.source === picked.source && p.projectId === picked.id);
    editingProject = existing ? { ...existing } : { source: picked.source, projectId: picked.id, path: picked.path, devEnabled: true, baseBranch: "", targetBranch: "", allowedCommands: [], instructions: "", isNew: true };
    return renderProjectForm();
  }

  if (!(t = el("[data-act]"))) return;
  const act = t.dataset.act;
  if (act === "refresh-tickets") return loadTickets(true);
  if (act === "dev-back") return go("#dev");
  if (act === "rev-back") return go("#reviews");
  if (act === "project-add") return openProjectEditor(null);
  if (act === "project-cancel") { editingProject = null; document.getElementById("project-editor").innerHTML = ""; return; }
  if (act === "toggle-sidebar") return setSidebarCollapsed(!document.body.classList.contains("collapsed"));
  if (act === "prompt-load-default" || act === "prompt-clear") {
    const area = document.querySelector(`[name="systemPrompts.${t.dataset.kind}"]`);
    if (act === "prompt-load-default" && area.value.trim() && !(await ask({ title: "Repartir du prompt d'origine ?", html: "<p>Ton prompt personnalisé est remplacé dans le champ par le prompt d'origine. Rien n'est enregistré tant que tu ne cliques pas sur Enregistrer.</p>", okLabel: "Remplacer" }))) return;
    area.value = act === "prompt-load-default" ? settingsData.defaultSystemPrompts[t.dataset.kind] : "";
    return toast(act === "prompt-load-default" ? "Prompt d'origine affiché : modifie-le puis enregistre." : "Champ vidé : le prompt d'origine sera utilisé après enregistrement.");
  }
  if (act === "term-open") return openTerminal();
  if (act === "term-hide") return hideTerminal();
  if (act === "term-stop") return stopTerminal();
  if (act === "claude-check") return refreshClaudeStatus(true);
  if (act === "secret-save" || act === "secret-delete") return secretAction(act, t.dataset.name);
  if (act === "runtime-check") return runRuntimeCheck(t);
  if (act === "game-toggle") return toggleGame(t.checked);
  if (act === "logout") {
    await api("/auth/logout", {}).catch(() => undefined);
    location.href = "/login";
    return;
  }
  if (act === "settings-reset") {
    if (!(await ask({ title: "Revenir aux valeurs par défaut ?", html: "<p>Le formulaire est réinitialisé. Rien n'est enregistré tant que tu ne cliques pas sur Enregistrer. Les projets ne sont pas touchés.</p>", okLabel: "Réinitialiser" }))) return;
    settingsData.settings = settingsData.defaults;
    return renderSettings();
  }
  if (act === "task-cancel") {
    if (!(await ask({ title: "Arrêter l'agent ?", html: "<p>L'agent est interrompu. Rien n'est poussé, le dossier de travail reste en place.</p>", okLabel: "Arrêter" }))) return;
    await api(`/api/tasks/${state.taskId}/cancel`, {}).catch((err) => toast(err.message, true));
    toast("Arrêt demandé.");
    return setTimeout(() => showTask(state.taskId), 1500);
  }
  if (act === "task-followup") return startFollowup();
  if (act === "piece-fix") return fixWithReview();
  if (act === "piece-review") {
    try {
      await api(`/api/tasks/${state.taskId}/review`, t.dataset.again === "1" ? { again: true } : {});
      toast("L'agent de review relit la MR…");
    } catch (err) { toast(err.message, true); }
    return loadPiece(state.taskId);
  }
  if (act === "piece-merge") {
    const target = t.dataset.target;
    if (!(await ask({ title: `Fusionner dans ${target} ?`, html: `<p>La MR de l'agent est <b>fusionnée dans la branche <code>${esc(target)}</code></b> chez ta forge, avec le code relu par l'agent de review. La branche de l'agent n'est pas supprimée.</p><p class="note">Pour revenir en arrière, il faudra annuler la fusion chez ta forge. L'outil ne déploie rien : la mise en ligne se fait comme d'habitude pour ce projet.</p>`, okLabel: "Fusionner" }))) return;
    try {
      await api(`/api/tasks/${state.taskId}/merge`, {});
      toast("MR fusionnée.");
      state.issues = null;
    } catch (err) { toast(err.message, true); }
    return loadPiece(state.taskId);
  }
  if (act === "task-relaunch") {
    const task = await api(`/api/tasks/${state.taskId}`).catch((err) => { toast(err.message, true); return null; });
    if (!task) return;
    const again = await ask({ title: `Relancer l'agent sur #${task.issue_iid} ?`, html: "<p>Une nouvelle tâche démarre sur le même ticket, avec les mêmes consignes et les mêmes pièces jointes. Si la branche d'un essai précédent existe encore chez la forge sans MR, l'outil crée une nouvelle branche (suffixe -2, -3...) sans toucher à l'ancienne.</p>", okLabel: "Relancer", attach: true });
    if (!again) return;
    try {
      const { id } = await api("/api/tasks", { source: task.source, projectId: task.project_id, issueIid: task.issue_iid, extraInstructions: task.extra_instructions || "", retryOf: task.id, attachments: again.attachments });
      toast("Agent relancé.");
      state.issues = null;
      refreshHeader();
      return go(`#dev/${id}`);
    } catch (err) { return toast(err.message, true); }
  }
  if (act === "task-delete") {
    if (!(await ask({ title: "Supprimer cette tâche ?", html: "<p>La tâche, son journal et le dossier de travail local sont supprimés de l'outil. <b>Rien n'est touché chez la forge</b> : si l'agent a poussé une branche ou ouvert une MR, ils restent là-bas, à supprimer chez la forge si tu n'en veux plus.</p>", okLabel: "Supprimer" }))) return;
    try {
      await api(`/api/tasks/${state.taskId}/delete`, {});
      toast("Tâche supprimée.");
      state.issues = null;
      refreshHeader();
      return go("#dev");
    } catch (err) { return toast(err.message, true); }
  }
  if (act === "task-cleanup") {
    if (!(await ask({ title: "Nettoyer le dossier local ?", html: "<p>Le dossier de travail de l'agent est supprimé de ta machine. La branche et la MR sur la forge ne sont pas touchées, mais tu ne pourras plus reprendre la session de l'agent.</p>", okLabel: "Nettoyer" }))) return;
    await api(`/api/tasks/${state.taskId}/cleanup`, {}).then(() => toast("Dossier supprimé.")).catch((err) => toast(err.message, true));
    return showTask(state.taskId);
  }
  if (["start", "publish", "approve", "retry", "dismiss", "agree", "disagree"].includes(act)) return reviewAction(act, t);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches?.("[data-secret-input]")) {
    e.preventDefault();
    return document.querySelector(`[data-act="secret-save"][data-name="${e.target.dataset.secretInput}"]`)?.click();
  }
  const card = e.target.closest?.(".card[data-task], .card[data-review]");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); card.click(); }
});

/** Sidebar repliée ou non, mémorisé par navigateur (sans conséquence si le stockage est indisponible). */
function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle("collapsed", collapsed);
  const btn = document.querySelector(".collapse-btn");
  btn.title = collapsed ? "Déplier le menu" : "Réduire le menu";
  btn.querySelector(".lbl").textContent = collapsed ? "Déplier" : "Réduire";
  try { localStorage.setItem("ra.sidebarCollapsed", collapsed ? "1" : "0"); } catch { /* stockage indisponible */ }
}
try { if (localStorage.getItem("ra.sidebarCollapsed") === "1") setSidebarCollapsed(true); } catch { /* stockage indisponible */ }

window.addEventListener("hashchange", route);
document.addEventListener("change", (e) => {
  if (e.target.id !== "ws-switch") return;
  if (e.target.value === "new") createOrganization();
  else switchWorkspace(Number(e.target.value));
});

/* =====================================================================
   Démarrage
   ===================================================================== */
(async () => {
  await refreshHeader();
  api("/api/settings").then((s) => { state.settingsCache = s.settings; if (state.tab === "tickets" && state.issues && location.hash !== "#tickets/new") renderTickets(); }).catch(() => undefined);
  await Promise.all([refreshGame(), refreshMe()]);
  route();
  setInterval(() => {
    refreshHeader();
    if (state.tab === "reviews") refreshReviews().catch(() => undefined);
    if (state.tab === "dev") refreshTasks().catch(() => undefined);
  }, 10000);
})();
</script>
